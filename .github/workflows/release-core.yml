# scripts/release-core.yml — Reusable build-once pre-publication release pipeline
#
# F-15/W9 (#8773): Build exactly once, smoke before any publication,
# draft then verify before promote, verify public after promote.
#
# Caller must provide:
#   - version: release version string (e.g., 0.99.52)
#   - tag: git tag name (e.g., v0.99.52)
#   - checkout-ref: git ref to build from
#
# This workflow does NOT create tags — it builds/publishes from an existing tag.

name: Release Core

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g. 0.99.52)'
        required: true
        type: string
      tag:
        description: 'Git tag (e.g. v0.99.52)'
        required: true
        type: string
      checkout-ref:
        description: 'Git ref to checkout and build from'
        required: true
        type: string
    outputs:
      version:
        description: 'Built release version'
        value: ${{ jobs.build.outputs.version }}
      tag:
        description: 'Built release tag'
        value: ${{ jobs.build.outputs.tag }}
      tarball-name:
        description: 'Built tarball filename'
        value: ${{ jobs.build.outputs.tarball-name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      tarball-name: ${{ steps.build.outputs.TARBALL_NAME }}
      commit: ${{ steps.version.outputs.COMMIT }}
      tag-object: ${{ steps.version.outputs.TAG_OBJECT }}
      tarball-path: ${{ steps.build.outputs.TARBALL_PATH }}
      tarball-artifact-name: q-release-build-${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-racket

      - name: Extract version
        id: version
        run: |
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "TAG_OBJECT=$(git rev-parse '${{ inputs.tag }}')" >> $GITHUB_OUTPUT

      - name: Build tarball
        id: build
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p /tmp/release
          cp -r . /tmp/release/q/
          cd /tmp/release
          # tarball name: q-VERSION.tar.gz
          TARBALL_NAME="q-${VERSION}.tar.gz"
          SOURCE_DATE_EPOCH=$(git -C q show -s --format=%ct HEAD)
          tar --sort=name \
            --mtime=@${SOURCE_DATE_EPOCH} \
            --owner=0 --group=0 --numeric-owner \
            --exclude='.git' \
            --exclude='compiled' \
            --exclude='*.zo' \
            -cf - q/ | gzip -n > "${TARBALL_NAME}"
          ls -la "${TARBALL_NAME}"
          echo "TARBALL_NAME=${TARBALL_NAME}" >> $GITHUB_OUTPUT
          echo "TARBALL_PATH=/tmp/release/${TARBALL_NAME}" >> $GITHUB_OUTPUT

      - name: Generate release manifest
        env:
          TARBALL_PATH: ${{ steps.build.outputs.TARBALL_PATH }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          test -s "${TARBALL_PATH}"
          cd /tmp/release/q
          racket scripts/gen-release-manifest.rkt "${TARBALL_PATH}" > /tmp/release/release-manifest.json
          test -s /tmp/release/release-manifest.json
          COMMIT=$(git rev-parse HEAD)
          TAG_OBJECT=$(git rev-parse "$TAG")
          racket scripts/verify-release-bundle.rkt \
            --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --tag-object "$TAG_OBJECT" \
            "${TARBALL_PATH}" /tmp/release/release-manifest.json
          cat /tmp/release/release-manifest.json

      - name: Generate release notes
        run: |
          VERSION="${{ inputs.version }}"
          cd /tmp/release/q
          racket scripts/gen-release-notes.rkt "${VERSION}" > /tmp/release/release-notes.md
          cat /tmp/release/release-notes.md

      - name: Upload internal build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q-release-build-${{ inputs.version }}
          path: |
            /tmp/release/q-${{ inputs.version }}.tar.gz
            /tmp/release/release-manifest.json
            /tmp/release/release-notes.md
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      RACKET_VERSION: '8.12'
    steps:
      - name: Checkout trusted verifier tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Install pinned Racket toolchain
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
        with:
          version: ${{ env.RACKET_VERSION }}

      - name: Verify internal bundle before extraction
        run: |
          racket tooling/scripts/verify-release-bundle.rkt \
            --version "${{ inputs.version }}" --tag "${{ inputs.tag }}" \
            --commit "${{ needs.build.outputs.commit }}" \
            --tag-object "${{ needs.build.outputs.tag-object }}" \
            "/tmp/release/q-${{ inputs.version }}.tar.gz" /tmp/release/release-manifest.json

      - name: Validate archive, extract, and install
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          cd /tmp/release
          names=$(tar -tzf "q-${VERSION}.tar.gz")
          test -n "$names"
          ! grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:)' <<<"$names"
          test "$(sort <<<"$names" | uniq -d | wc -l)" -eq 0
          test "$(wc -l <<<"$names")" -le 100000
          ! tar -tvzf "q-${VERSION}.tar.gz" | grep -Eq '^[bcpPs]'
          ! tar -tvzf "q-${VERSION}.tar.gz" | grep -Eq ' -> (\.\./|/)| link to (\.\./|/)'
          mkdir -p /tmp/release/extracted
          tar --no-same-owner --no-same-permissions -xzf "q-${VERSION}.tar.gz" -C /tmp/release/extracted
          root=$(realpath /tmp/release/extracted)
          while IFS= read -r link; do
            resolved=$(realpath -m "$link")
            case "$resolved" in "$root"/*) ;; *) echo "escaping extracted link: $link"; exit 1;; esac
          done < <(find /tmp/release/extracted -type l)
          test -z "$(find /tmp/release/extracted \( -type b -o -type c -o -type p -o -type s \) -print -quit)"
          cd /tmp/release/extracted
          test -d q
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          cd q
          raco pkg install --auto --batch

      - name: Verify q --version
        run: |
          VERSION="${{ inputs.version }}"
          cd /tmp/release/extracted/q
          OUTPUT=$(racket main.rkt --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "version ${VERSION}"

      - name: Run release-smoke test suite
        run: |
          set -o pipefail
          cd /tmp/release/extracted/q
          echo "Running release-smoke suite (deterministic, artifact-focused)"
          STRICT_TEST_RUNNER=1 racket scripts/run-tests.rkt \
            --suite release-smoke \
            --jobs 4 \
            --timeout 120 \
            2>&1 | tee smoke-output.log

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-output-log-${{ inputs.version }}
          path: /tmp/release/extracted/q/smoke-output.log
          retention-days: 30

  draft:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release-id: ${{ steps.draft.outputs.RELEASE_ID }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          # Create draft release with assets
          gh release create "$TAG" \
            /tmp/release/q-${VERSION}.tar.gz \
            /tmp/release/release-manifest.json \
            --notes-file /tmp/release/release-notes.md \
            --draft \
            --repo ${{ github.repository }}
          # Get the newly created release ID
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "Created draft release: ${RELEASE_ID}"

  verify-draft:
    needs: draft
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ needs.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-racket

      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          RELEASE_ID="${{ needs.draft.outputs.release-id }}"
          release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .draft <<<"$release")" = true
          echo "Verifying draft release $RELEASE_ID assets for ${TAG}..."

          # Wait for this exact release ID and resolve exact asset IDs.
          RELEASE_FOUND=false
          for i in $(seq 1 30); do
            if release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" 2>/dev/null); then
              test "$(jq -r .tag_name <<<"$release")" = "$TAG"
              test "$(jq -r .draft <<<"$release")" = true
              RELEASE_FOUND=true; break
            fi
            sleep 5
          done
          [ "$RELEASE_FOUND" = true ] || { echo "ERROR: exact draft release unavailable"; exit 1; }

          mkdir -p /tmp/verify
          TARBALL="q-${VERSION}.tar.gz"
          TARBALL_ID=$(jq -r --arg n "$TARBALL" '.assets[] | select(.name==$n) | .id' <<<"$release")
          MANIFEST_ID=$(jq -r '.assets[] | select(.name=="release-manifest.json") | .id' <<<"$release")
          test -n "$TARBALL_ID" && test -n "$MANIFEST_ID"
          gh api "repos/${{ github.repository }}/releases/assets/$TARBALL_ID" \
            -H 'Accept: application/octet-stream' > "/tmp/verify/$TARBALL"
          gh api "repos/${{ github.repository }}/releases/assets/$MANIFEST_ID" \
            -H 'Accept: application/octet-stream' > /tmp/verify/release-manifest.json

          # Compare against locally-built artifact
          LOCAL_MANIFEST="/tmp/release/release-manifest.json"
          test -s "$LOCAL_MANIFEST"
          test -s "/tmp/release/${TARBALL}"
          test -s /tmp/verify/release-manifest.json
          test -s "/tmp/verify/${TARBALL}"
          cmp --silent /tmp/verify/release-manifest.json "$LOCAL_MANIFEST" || {
            echo "ERROR: Release manifest differs from internal artifact"; exit 1;
          }
          cmp --silent "/tmp/verify/${TARBALL}" "/tmp/release/${TARBALL}" || {
            echo "ERROR: Tarball differs from internal artifact"; exit 1;
          }
          release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .draft <<<"$release")" = true
          echo "All draft assets verified successfully."

      - name: Semantically verify draft release bundle from trusted checkout
        run: |
          COMMIT=$(git rev-parse HEAD)
          TAG_OBJECT=$(git rev-parse "${{ inputs.tag }}")
          racket scripts/verify-release-bundle.rkt \
            --version "${{ inputs.version }}" --tag "${{ inputs.tag }}" \
            --commit "$COMMIT" --tag-object "$TAG_OBJECT" \
            "/tmp/verify/q-${{ inputs.version }}.tar.gz" \
            /tmp/verify/release-manifest.json

  publish:
    needs: verify-draft
    runs-on: ubuntu-latest
    environment: release-repair
    outputs:
      release-id: ${{ needs.verify-draft.outputs.release-id }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-racket
      - name: Download verified build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Publish exact draft and verify transactionally
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          EXPECTED_COMMIT="${{ inputs.checkout-ref }}"
          RELEASE_ID="${{ needs.verify-draft.outputs.release-id }}"
          TARBALL="q-${VERSION}.tar.gz"

          tag_ref=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}")
          test "$(jq -r .object.type <<<"$tag_ref")" = tag
          TAG_OBJECT=$(jq -r .object.sha <<<"$tag_ref")
          tag_data=$(gh api "repos/${{ github.repository }}/git/tags/${TAG_OBJECT}")
          test "$(jq -r .object.type <<<"$tag_data")" = commit
          test "$(jq -r .object.sha <<<"$tag_data")" = "$EXPECTED_COMMIT"

          release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .target_commitish <<<"$release")" = "$EXPECTED_COMMIT"
          test "$(jq -r .draft <<<"$release")" = true

          rollback_to_draft() {
            echo "Immediate public verification failed; restoring release ${RELEASE_ID} to draft" >&2
            gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=true >/dev/null
          }
          trap rollback_to_draft ERR

          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false >/dev/null
          public=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .draft <<<"$public")" = false
          test "$(jq -r .tag_name <<<"$public")" = "$TAG"
          test "$(jq -r .target_commitish <<<"$public")" = "$EXPECTED_COMMIT"
          TARBALL_ID=$(jq -r --arg n "$TARBALL" '.assets[] | select(.name==$n) | .id' <<<"$public")
          MANIFEST_ID=$(jq -r '.assets[] | select(.name=="release-manifest.json") | .id' <<<"$public")
          test -n "$TARBALL_ID" && test -n "$MANIFEST_ID"
          mkdir -p /tmp/immediate-public
          gh api "repos/${{ github.repository }}/releases/assets/$TARBALL_ID" -H 'Accept: application/octet-stream' > "/tmp/immediate-public/$TARBALL"
          gh api "repos/${{ github.repository }}/releases/assets/$MANIFEST_ID" -H 'Accept: application/octet-stream' > /tmp/immediate-public/release-manifest.json
          cmp --silent "/tmp/release/$TARBALL" "/tmp/immediate-public/$TARBALL"
          cmp --silent /tmp/release/release-manifest.json /tmp/immediate-public/release-manifest.json
          racket scripts/verify-release-bundle.rkt \
            --version "$VERSION" --tag "$TAG" --commit "$EXPECTED_COMMIT" --tag-object "$TAG_OBJECT" \
            "/tmp/immediate-public/$TARBALL" /tmp/immediate-public/release-manifest.json
          trap - ERR
          echo "Release published and immediately verified: ${TAG}"

  verify-public:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-racket

      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Verify public assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          RELEASE_ID="${{ needs.publish.outputs.release-id }}"
          echo "Verifying public release $RELEASE_ID assets for ${TAG}..."

          # Fetch public release by tag, failing closed after bounded retries.
          RELEASE_DATA=""
          for i in $(seq 1 15); do
            if RELEASE_DATA=$(curl -fsS -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}"); then
              test -n "$RELEASE_DATA"
              echo "Public release found (attempt $i)"
              break
            fi
            RELEASE_DATA=""
            echo "Waiting for public release (attempt $i)..."
            sleep 5
          done
          test -n "$RELEASE_DATA" || { echo "ERROR: public release did not become available"; exit 1; }
          test "$(jq -r .tag_name <<<"$RELEASE_DATA")" = "$TAG"
          test "$(jq -r .draft <<<"$RELEASE_DATA")" = false

          # Verify tarball
          TARBALL="q-${VERSION}.tar.gz"
          TARBALL_URL=$(echo "$RELEASE_DATA" | jq -r ".assets[] | select(.name==\"${TARBALL}\") | .url")
          if [ -z "$TARBALL_URL" ] || [ "$TARBALL_URL" = "null" ]; then
            echo "ERROR: Asset ${TARBALL} not found in public release ${TAG}"
            exit 1
          fi

          curl -sfL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o "/tmp/public-verify-${TARBALL}" "$TARBALL_URL"

          # Verify manifest
          MANIFEST_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name=="release-manifest.json") | .url')
          if [ -z "$MANIFEST_URL" ] || [ "$MANIFEST_URL" = "null" ]; then
            echo "ERROR: Asset release-manifest.json not found in public release ${TAG}"
            exit 1
          fi

          curl -sfL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o /tmp/public-verify-release-manifest.json "$MANIFEST_URL"

          # Verify against internal artifact
          LOCAL_MANIFEST="/tmp/release/release-manifest.json"
          test -s "$LOCAL_MANIFEST"
          test -s "/tmp/release/${TARBALL}"
          test -s /tmp/public-verify-release-manifest.json
          test -s "/tmp/public-verify-${TARBALL}"
          cmp --silent /tmp/public-verify-release-manifest.json "$LOCAL_MANIFEST" || {
            echo "ERROR: Public manifest differs from internal artifact"; exit 1;
          }
          cmp --silent "/tmp/public-verify-${TARBALL}" "/tmp/release/${TARBALL}" || {
            echo "ERROR: Public tarball differs from internal artifact"; exit 1;
          }
          echo "All public assets verified successfully."

      - name: Semantically verify public release bundle from trusted checkout
        run: |
          COMMIT=$(git rev-parse HEAD)
          TAG_OBJECT=$(git rev-parse "${{ inputs.tag }}")
          racket scripts/verify-release-bundle.rkt \
            --version "${{ inputs.version }}" --tag "${{ inputs.tag }}" \
            --commit "$COMMIT" --tag-object "$TAG_OBJECT" \
            "/tmp/public-verify-q-${{ inputs.version }}.tar.gz" \
            /tmp/public-verify-release-manifest.json
