# scripts/release-core.yml — Reusable build-once pre-publication release pipeline
#
# F-15/W9 (#8773): Build exactly once, smoke before any publication,
# draft then verify before promote, verify public after promote.
#
# BUG-0045 (v1.00.21 W3): duplicate tag-push triggers must converge, not
# race — the draft job adopts an existing same-tag+commit draft, and
# publish recognizes an already-published release, re-verifies its
# assets, and succeeds as a no-op (see the caller release.yml
# concurrency group that serializes same-tag runs).
#
# Caller must provide:
#   - version: release version string (e.g., 0.99.52)
#   - tag: git tag name (e.g., v0.99.52)
#   - checkout-ref: git ref to build from
#
# This workflow does NOT create tags — it builds/publishes from an existing tag.

name: Release Core

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g. 0.99.52)'
        required: true
        type: string
      tag:
        description: 'Git tag (e.g. v0.99.52)'
        required: true
        type: string
      checkout-ref:
        description: 'Git ref to checkout and build from'
        required: true
        type: string
    outputs:
      version:
        description: 'Built release version'
        value: ${{ jobs.build.outputs.version }}
      tag:
        description: 'Built release tag'
        value: ${{ jobs.build.outputs.tag }}
      tarball-name:
        description: 'Built tarball filename'
        value: ${{ jobs.build.outputs.tarball-name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      tarball-name: ${{ steps.build.outputs.TARBALL_NAME }}
      commit: ${{ steps.version.outputs.COMMIT }}
      tag-object: ${{ steps.version.outputs.TAG_OBJECT }}
      tarball-path: ${{ steps.build.outputs.TARBALL_PATH }}
      tarball-artifact-name: q-release-build-${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-racket

      - name: Extract version
        id: version
        run: |
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "TAG_OBJECT=$(git rev-parse '${{ inputs.tag }}')" >> $GITHUB_OUTPUT

      - name: Build tarball
        id: build
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p /tmp/release
          cp -r . /tmp/release/q/
          cd /tmp/release
          # tarball name: q-VERSION.tar.gz
          TARBALL_NAME="q-${VERSION}.tar.gz"
          SOURCE_DATE_EPOCH=$(git -C q show -s --format=%ct HEAD)
          tar --sort=name \
            --mtime=@${SOURCE_DATE_EPOCH} \
            --owner=0 --group=0 --numeric-owner \
            --exclude='.git' \
            --exclude='compiled' \
            --exclude='*.zo' \
            --exclude='q/tests/metadata-discovery/fixture' \
            -cf - q/ | gzip -n > "${TARBALL_NAME}"
          ls -la "${TARBALL_NAME}"
          echo "TARBALL_NAME=${TARBALL_NAME}" >> $GITHUB_OUTPUT
          echo "TARBALL_PATH=/tmp/release/${TARBALL_NAME}" >> $GITHUB_OUTPUT

      - name: Verify architecture artifacts unchanged in release copy
        run: |
          # Snapshot source checkout (default working directory = checkout root)
          racket scripts/release-integrity-guard.rkt --validate-rktd
          racket scripts/release-integrity-guard.rkt --snapshot > /tmp/source-snapshot.json
          # Snapshot release copy
          cd /tmp/release/q
          racket scripts/release-integrity-guard.rkt --validate-rktd
          racket scripts/release-integrity-guard.rkt --snapshot > /tmp/release-copy-snapshot.json
          # The copy must have identical hashes to the source
          diff <(jq -S 'sort_by(.path)' /tmp/source-snapshot.json) \
               <(jq -S 'sort_by(.path)' /tmp/release-copy-snapshot.json) \
            || { echo "ERROR: Architecture artifacts differ between source and release copy"; exit 1; }

      - name: Generate release manifest
        env:
          TARBALL_PATH: ${{ steps.build.outputs.TARBALL_PATH }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          test -s "${TARBALL_PATH}"
          cd /tmp/release/q
          racket scripts/gen-release-manifest.rkt "${TARBALL_PATH}" > /tmp/release/release-manifest.json
          test -s /tmp/release/release-manifest.json
          COMMIT=$(git rev-parse HEAD)
          TAG_OBJECT=$(git rev-parse "$TAG")
          racket scripts/verify-release-bundle.rkt \
            --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --tag-object "$TAG_OBJECT" \
            "${TARBALL_PATH}" /tmp/release/release-manifest.json
          cat /tmp/release/release-manifest.json

      - name: Generate release notes
        run: |
          VERSION="${{ inputs.version }}"
          cd /tmp/release/q
          racket scripts/gen-release-notes.rkt "${VERSION}" > /tmp/release/release-notes.md
          cat /tmp/release/release-notes.md

      - name: Upload internal build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q-release-build-${{ inputs.version }}
          path: |
            /tmp/release/q-${{ inputs.version }}.tar.gz
            /tmp/release/release-manifest.json
            /tmp/release/release-notes.md
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      RACKET_VERSION: '8.12'
    steps:
      - name: Checkout trusted verifier tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Install pinned Racket toolchain
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
        with:
          version: ${{ env.RACKET_VERSION }}

      - name: Verify internal bundle before extraction
        run: |
          racket tooling/scripts/verify-release-bundle.rkt \
            --version "${{ inputs.version }}" --tag "${{ inputs.tag }}" \
            --commit "${{ needs.build.outputs.commit }}" \
            --tag-object "${{ needs.build.outputs.tag-object }}" \
            "/tmp/release/q-${{ inputs.version }}.tar.gz" /tmp/release/release-manifest.json

      - name: Validate archive, extract, and install
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          cd /tmp/release
          names=$(tar -tzf "q-${VERSION}.tar.gz")
          test -n "$names"
          ! grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:)' <<<"$names"
          test "$(sort <<<"$names" | uniq -d | wc -l)" -eq 0
          test "$(wc -l <<<"$names")" -le 100000
          ! tar -tvzf "q-${VERSION}.tar.gz" | grep -Eq '^[bcpPs]'
          ! tar -tvzf "q-${VERSION}.tar.gz" | grep -Eq ' -> (\.\./|/)| link to (\.\./|/)'
          mkdir -p /tmp/release/extracted
          tar --no-same-owner --no-same-permissions -xzf "q-${VERSION}.tar.gz" -C /tmp/release/extracted
          root=$(realpath /tmp/release/extracted)
          while IFS= read -r link; do
            resolved=$(realpath -m "$link")
            case "$resolved" in "$root"/*) ;; *) echo "escaping extracted link: $link"; exit 1;; esac
          done < <(find /tmp/release/extracted -type l)
          test -z "$(find /tmp/release/extracted \( -type b -o -type c -o -type p -o -type s \) -print -quit)"
          cd /tmp/release/extracted
          test -d q
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          cd q
          raco pkg install --auto --batch

      - name: Verify q --version
        run: |
          VERSION="${{ inputs.version }}"
          cd /tmp/release/extracted/q
          OUTPUT=$(racket main.rkt --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "version ${VERSION}"

      - name: Run release-smoke test suite
        run: |
          set -o pipefail
          cd /tmp/release/extracted/q
          echo "Running release-smoke suite (deterministic, artifact-focused)"
          STRICT_TEST_RUNNER=1 racket scripts/run-tests.rkt \
            --suite release-smoke \
            --jobs 4 \
            --timeout 120 \
            2>&1 | tee smoke-output.log

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-output-log-${{ inputs.version }}
          path: /tmp/release/extracted/q/smoke-output.log
          retention-days: 30

  draft:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release-id: ${{ steps.draft.outputs.RELEASE_ID }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Create or adopt draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          COMMIT="${{ inputs.checkout-ref }}"
          TARBALL="q-${VERSION}.tar.gz"

          # BUG-0045 draft adoption: a cancelled twin run for this same
          # tag (concurrency cancel-in-progress) may already have left a
          # draft release for this exact tag+commit behind. Reuse it
          # instead of creating a second draft that can never publish
          # once the tag is claimed, and would strand an untagged draft
          # for manual cleanup. Drafts are not addressable via
          # releases/tags/$TAG (404 for drafts), so scan the release
          # list for a draft matching tag_name + target_commitish.
          RELEASE_ID=""
          for page in 1 2 3 4 5; do
            page_releases=$(gh api "repos/${{ github.repository }}/releases?per_page=100&page=${page}")
            adopted_id=$(jq -r --arg tag "$TAG" --arg commit "$COMMIT" \
              '.[] | select(.draft == true and .tag_name == $tag and .target_commitish == $commit) | .id' \
              <<<"$page_releases" | head -n 1)
            if [ -n "$adopted_id" ] && [ "$adopted_id" != "null" ]; then
              RELEASE_ID="$adopted_id"
              break
            fi
            [ "$(jq 'length' <<<"$page_releases")" -lt 100 ] && break
          done

          if [ -n "$RELEASE_ID" ]; then
            echo "Adopting existing draft release for ${TAG}@${COMMIT}: ${RELEASE_ID}"
            # Same-named assets would 422 on upload; drop the adopted
            # draft's stale copies first (the deterministic build makes
            # the re-upload byte-identical, and verify-draft re-compares
            # the uploaded bytes against the local artifact anyway).
            adopted_release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
            for asset_id in $(jq -r '.assets[].id' <<<"$adopted_release"); do
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
            done
          else
            # Create draft release via API to capture ID directly.
            # gh release create --draft uses an untagged-* placeholder, so
            # releases/tags/$TAG lookup returns 404 for drafts.
            RELEASE_NOTES=$(cat /tmp/release/release-notes.md)
            RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
              --method POST \
              -f tag_name="$TAG" \
              -f target_commitish="$COMMIT" \
              -f name="q v${VERSION}" \
              --raw-field body="$RELEASE_NOTES" \
              -F draft=true \
              --jq .id)
            echo "Created draft release: ${RELEASE_ID}"
          fi
          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_OUTPUT
          # Upload assets via API
          gh api --method POST \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${TARBALL}" \
            -H 'Content-Type: application/gzip' \
            --input "/tmp/release/${TARBALL}"
          gh api --method POST \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=release-manifest.json" \
            -H 'Content-Type: application/json' \
            --input /tmp/release/release-manifest.json

  verify-draft:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release-id: ${{ needs.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-racket

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          RELEASE_ID="${{ needs.draft.outputs.release-id }}"
          release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .draft <<<"$release")" = true
          echo "Verifying draft release $RELEASE_ID assets for ${TAG}..."

          # Wait for this exact release ID and resolve exact asset IDs.
          RELEASE_FOUND=false
          for i in $(seq 1 30); do
            if release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" 2>/dev/null); then
              test "$(jq -r .tag_name <<<"$release")" = "$TAG"
              test "$(jq -r .draft <<<"$release")" = true
              RELEASE_FOUND=true; break
            fi
            sleep 5
          done
          [ "$RELEASE_FOUND" = true ] || { echo "ERROR: exact draft release unavailable"; exit 1; }

          mkdir -p /tmp/verify
          TARBALL="q-${VERSION}.tar.gz"
          TARBALL_ID=$(jq -r --arg n "$TARBALL" '.assets[] | select(.name==$n) | .id' <<<"$release")
          MANIFEST_ID=$(jq -r '.assets[] | select(.name=="release-manifest.json") | .id' <<<"$release")
          test -n "$TARBALL_ID" && test -n "$MANIFEST_ID"
          gh api "repos/${{ github.repository }}/releases/assets/$TARBALL_ID" \
            -H 'Accept: application/octet-stream' > "/tmp/verify/$TARBALL"
          gh api "repos/${{ github.repository }}/releases/assets/$MANIFEST_ID" \
            -H 'Accept: application/octet-stream' > /tmp/verify/release-manifest.json

          # Compare against locally-built artifact
          LOCAL_MANIFEST="/tmp/release/release-manifest.json"
          test -s "$LOCAL_MANIFEST"
          test -s "/tmp/release/${TARBALL}"
          test -s /tmp/verify/release-manifest.json
          test -s "/tmp/verify/${TARBALL}"
          cmp --silent /tmp/verify/release-manifest.json "$LOCAL_MANIFEST" || {
            echo "ERROR: Release manifest differs from internal artifact"; exit 1;
          }
          cmp --silent "/tmp/verify/${TARBALL}" "/tmp/release/${TARBALL}" || {
            echo "ERROR: Tarball differs from internal artifact"; exit 1;
          }
          release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .draft <<<"$release")" = true
          echo "All draft assets verified successfully."

      - name: Semantically verify draft release bundle from trusted checkout
        run: |
          COMMIT=$(git rev-parse HEAD)
          TAG_OBJECT=$(git rev-parse "${{ inputs.tag }}")
          racket scripts/verify-release-bundle.rkt \
            --version "${{ inputs.version }}" --tag "${{ inputs.tag }}" \
            --commit "$COMMIT" --tag-object "$TAG_OBJECT" \
            "/tmp/verify/q-${{ inputs.version }}.tar.gz" \
            /tmp/verify/release-manifest.json

  publish:
    needs: verify-draft
    runs-on: ubuntu-latest
    environment: release-repair
    outputs:
      # BUG-0045: dynamic — the already-published no-op path outputs the
      # live published release's ID so verify-public checks the real
      # public release, not our (then deleted) redundant draft.
      release-id: ${{ steps.publish.outputs.release-id }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-racket
      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Publish exact draft and verify transactionally
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          EXPECTED_COMMIT="${{ inputs.checkout-ref }}"
          RELEASE_ID="${{ needs.verify-draft.outputs.release-id }}"
          TARBALL="q-${VERSION}.tar.gz"

          tag_ref=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}")
          test "$(jq -r .object.type <<<"$tag_ref")" = tag
          TAG_OBJECT=$(jq -r .object.sha <<<"$tag_ref")
          tag_data=$(gh api "repos/${{ github.repository }}/git/tags/${TAG_OBJECT}")
          test "$(jq -r .object.type <<<"$tag_data")" = commit
          test "$(jq -r .object.sha <<<"$tag_data")" = "$EXPECTED_COMMIT"

          # ── BUG-0045 publish idempotence ──
          # A twin run for this same tag (a duplicate trigger that raced
          # past the concurrency cancel, or one that resumed from the
          # release-repair environment queue after this tag was already
          # published) may already have published this exact release.
          # PATCH draft=false on our draft would then 422 and paint a
          # verified release red. Instead: recognize the published
          # release, RE-VERIFY its assets (names present, byte-identical
          # to the verified build, semantic bundle verification — never
          # skip verification to "succeed"), clean up our now-unpublishable
          # draft, and succeed as a no-op.
          published=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" 2>/dev/null) || published=""
          if [ -n "$published" ] && [ "$(jq -r .draft <<<"$published")" = false ]; then
            test "$(jq -r .tag_name <<<"$published")" = "$TAG"
            test "$(jq -r .target_commitish <<<"$published")" = "$EXPECTED_COMMIT"
            PUB_RELEASE_ID=$(jq -r .id <<<"$published")
            PUB_TARBALL_ID=$(jq -r --arg n "$TARBALL" '.assets[] | select(.name==$n) | .id' <<<"$published")
            PUB_MANIFEST_ID=$(jq -r '.assets[] | select(.name=="release-manifest.json") | .id' <<<"$published")
            if [ -z "$PUB_TARBALL_ID" ] || [ -z "$PUB_MANIFEST_ID" ]; then
              echo "ERROR: already-published release ${PUB_RELEASE_ID} is missing required assets"
              exit 1
            fi
            mkdir -p /tmp/already-public
            gh api "repos/${{ github.repository }}/releases/assets/$PUB_TARBALL_ID" \
              -H 'Accept: application/octet-stream' > "/tmp/already-public/$TARBALL"
            gh api "repos/${{ github.repository }}/releases/assets/$PUB_MANIFEST_ID" \
              -H 'Accept: application/octet-stream' > /tmp/already-public/release-manifest.json
            cmp --silent "/tmp/release/$TARBALL" "/tmp/already-public/$TARBALL" || {
              echo "ERROR: already-published tarball differs from verified build"; exit 1;
            }
            cmp --silent /tmp/release/release-manifest.json /tmp/already-public/release-manifest.json || {
              echo "ERROR: already-published manifest differs from verified build"; exit 1;
            }
            racket scripts/verify-release-bundle.rkt \
              --version "$VERSION" --tag "$TAG" --commit "$EXPECTED_COMMIT" --tag-object "$TAG_OBJECT" \
              "/tmp/already-public/$TARBALL" /tmp/already-public/release-manifest.json
            # Our draft can never publish now (the tag is claimed); it
            # would strand as an untagged draft for manual cleanup.
            # Remove it and hand the published release ID downstream so
            # verify-public checks the real public release.
            WINNING_RUN=$(gh api "repos/${{ github.repository }}/actions/runs?event=push&per_page=50" \
              --jq ".workflow_runs[] | select(.head_branch == \"${TAG}\") | select(.id != ${GITHUB_RUN_ID}) | .id" \
              2>/dev/null | head -n 1 || true)
            echo "already published by run ${WINNING_RUN:-unknown} (release ${PUB_RELEASE_ID}); assets re-verified, publish is a no-op"
            gh api --method DELETE "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              || echo "WARN: could not remove redundant draft ${RELEASE_ID} (manual cleanup may be needed)"
            echo "release-id=${PUB_RELEASE_ID}" >> $GITHUB_OUTPUT
            exit 0
          fi

          release=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .target_commitish <<<"$release")" = "$EXPECTED_COMMIT"
          test "$(jq -r .draft <<<"$release")" = true

          rollback_to_draft() {
            echo "Immediate public verification failed; restoring release ${RELEASE_ID} to draft" >&2
            for attempt in 1 2 3; do
              if gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=true >/dev/null; then
                restored=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
                if test "$(jq -r .draft <<<"$restored")" = true; then
                  echo "Release ${RELEASE_ID} confirmed restored to draft" >&2
                  return 0
                fi
              fi
              sleep "$attempt"
            done
            echo "FATAL: release ${RELEASE_ID} could not be confirmed draft after rollback" >&2
            return 1
          }
          trap rollback_to_draft ERR

          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false >/dev/null
          public=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          test "$(jq -r .draft <<<"$public")" = false
          test "$(jq -r .tag_name <<<"$public")" = "$TAG"
          test "$(jq -r .target_commitish <<<"$public")" = "$EXPECTED_COMMIT"
          post_tag_ref=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}")
          test "$(jq -r .object.type <<<"$post_tag_ref")" = tag
          test "$(jq -r .object.sha <<<"$post_tag_ref")" = "$TAG_OBJECT"
          post_tag_data=$(gh api "repos/${{ github.repository }}/git/tags/${TAG_OBJECT}")
          test "$(jq -r .object.type <<<"$post_tag_data")" = commit
          test "$(jq -r .object.sha <<<"$post_tag_data")" = "$EXPECTED_COMMIT"
          TARBALL_ID=$(jq -r --arg n "$TARBALL" '.assets[] | select(.name==$n) | .id' <<<"$public")
          MANIFEST_ID=$(jq -r '.assets[] | select(.name=="release-manifest.json") | .id' <<<"$public")
          test -n "$TARBALL_ID" && test -n "$MANIFEST_ID"
          mkdir -p /tmp/immediate-public
          gh api "repos/${{ github.repository }}/releases/assets/$TARBALL_ID" -H 'Accept: application/octet-stream' > "/tmp/immediate-public/$TARBALL"
          gh api "repos/${{ github.repository }}/releases/assets/$MANIFEST_ID" -H 'Accept: application/octet-stream' > /tmp/immediate-public/release-manifest.json
          cmp --silent "/tmp/release/$TARBALL" "/tmp/immediate-public/$TARBALL"
          cmp --silent /tmp/release/release-manifest.json /tmp/immediate-public/release-manifest.json
          racket scripts/verify-release-bundle.rkt \
            --version "$VERSION" --tag "$TAG" --commit "$EXPECTED_COMMIT" --tag-object "$TAG_OBJECT" \
            "/tmp/immediate-public/$TARBALL" /tmp/immediate-public/release-manifest.json
          trap - ERR
          echo "release-id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "Release published and immediately verified: ${TAG}"

  verify-public:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-racket

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: q-release-build-${{ inputs.version }}
          path: /tmp/release

      - name: Verify public assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          RELEASE_ID="${{ needs.publish.outputs.release-id }}"
          echo "Verifying public release $RELEASE_ID assets for ${TAG}..."

          # Fetch public release by tag, failing closed after bounded retries.
          RELEASE_DATA=""
          for i in $(seq 1 15); do
            if RELEASE_DATA=$(curl -fsS -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}"); then
              test -n "$RELEASE_DATA"
              echo "Public release found (attempt $i)"
              break
            fi
            RELEASE_DATA=""
            echo "Waiting for public release (attempt $i)..."
            sleep 5
          done
          test -n "$RELEASE_DATA" || { echo "ERROR: public release did not become available"; exit 1; }
          test "$(jq -r .tag_name <<<"$RELEASE_DATA")" = "$TAG"
          test "$(jq -r .draft <<<"$RELEASE_DATA")" = false

          # Verify tarball
          TARBALL="q-${VERSION}.tar.gz"
          TARBALL_URL=$(echo "$RELEASE_DATA" | jq -r ".assets[] | select(.name==\"${TARBALL}\") | .url")
          if [ -z "$TARBALL_URL" ] || [ "$TARBALL_URL" = "null" ]; then
            echo "ERROR: Asset ${TARBALL} not found in public release ${TAG}"
            exit 1
          fi

          mkdir -p /tmp/public-verify
          curl -sfL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o "/tmp/public-verify/${TARBALL}" "$TARBALL_URL"

          # Verify manifest
          MANIFEST_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name=="release-manifest.json") | .url')
          if [ -z "$MANIFEST_URL" ] || [ "$MANIFEST_URL" = "null" ]; then
            echo "ERROR: Asset release-manifest.json not found in public release ${TAG}"
            exit 1
          fi

          curl -sfL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o /tmp/public-verify/release-manifest.json "$MANIFEST_URL"

          # Verify against internal artifact
          LOCAL_MANIFEST="/tmp/release/release-manifest.json"
          test -s "$LOCAL_MANIFEST"
          test -s "/tmp/release/${TARBALL}"
          test -s /tmp/public-verify/release-manifest.json
          test -s "/tmp/public-verify/${TARBALL}"
          cmp --silent /tmp/public-verify/release-manifest.json "$LOCAL_MANIFEST" || {
            echo "ERROR: Public manifest differs from internal artifact"; exit 1;
          }
          cmp --silent "/tmp/public-verify/${TARBALL}" "/tmp/release/${TARBALL}" || {
            echo "ERROR: Public tarball differs from internal artifact"; exit 1;
          }
          echo "All public assets verified successfully."

      - name: Semantically verify public release bundle from trusted checkout
        run: |
          COMMIT=$(git rev-parse HEAD)
          TAG_OBJECT=$(git rev-parse "${{ inputs.tag }}")
          racket scripts/verify-release-bundle.rkt \
            --version "${{ inputs.version }}" --tag "${{ inputs.tag }}" \
            --commit "$COMMIT" --tag-object "$TAG_OBJECT" \
            "/tmp/public-verify/q-${{ inputs.version }}.tar.gz" \
            /tmp/public-verify/release-manifest.json
