name: CI

# W3 prepared-environment cutover (docs/reports/prepared-environment-pilot-v1.00.11.md
# + docs/reports/CI-RACKET-CACHE-POLICY.md):
# The ubuntu fast-gate `test` shards below restore the verified prepared
# environment produced by the `fast-env` job (addon-store/ + q-compiled/ +
# manifest.json, verified against the job tuple before any test) and fall
# back — loudly, never silently — to the full setup-racket install+compile
# path when the producer is skipped, fails, or the restore mismatches; the
# fallback marks the artifact as rebuilt. All other setup-racket call sites
# keep the per-job full path. macOS platform lanes keep compile-on-every-hit
# (v1.00.10 release condition). Rollback switch: repository variable
# RACKET_PREPARED_ARTIFACT=off restores exactly the per-job path with no
# change to test selection or L4 semantics.
# BUG-0065 systemic (v1.00.29 W4): every lane consuming a restored or
# freshly prepared workspace purges + verifies workspace bytecode inside
# setup-racket BEFORE tests execute — restored .zo mtimes are never a
# freshness signal (docs/reports/PREPARED-ENV-BYTECODE-PINNING-v1.00.29.md).
# W6 prepared-environment EXPANSION (spec §6 W4): the verified restore is
# expanded to every ci.yml consumer whose environment profile is provably
# identical to the fast-env producer tuple (Linux/x64/Racket 8.10/CS/full,
# same reviewed lock, same precompile recipe revision, same policy
# knobs): smoke, the two workflows shards, release-dry-run,
# gsd-governance, abstraction-audit and prepared-env-report join the
# already-activated fast-gate test shards. Each consumer keeps the
# guarded restore inside setup-racket (manifest verify + W6 identity
# manifest compare; ANY identity mismatch = loud, counted cold fallback).
# Distinct environments stay separate: macOS platform lanes, the Racket
# 8.11 cross-version lane, the STRICT security queue and lint-quality
# (which must stay parallel to fast-env per the W2 checkpoint) remain on
# the full per-job path — see
# artifacts/proof-graph/v1.00.29-w6/consumers.json for the full matrix.
# Rollback (§11.6, one command per consumer): set the consumer's
# repository variable (RACKET_PREPARED_SMOKE, RACKET_PREPARED_WORKFLOWS,
# RACKET_PREPARED_RELEASE_DRY_RUN, RACKET_PREPARED_GSD_GOVERNANCE,
# RACKET_PREPARED_ABSTRACTION_AUDIT, RACKET_PREPARED_ENV_REPORT) to off,
# or RACKET_PREPARED_ARTIFACT=off for every consumer at once — each job
# then evaluates its PREPARED_ENV expression to 'off' and runs exactly
# the legacy full path. The producer stays available for the remaining
# consumers.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Canonical SHA-256 of the official Racket 8.10 x64/full/CS Linux
  # installer archive, shared by the prepared-environment producer
  # (fast-env) and the guarded restore inside setup-racket. Mirrors
  # .github/workflows/prepared-environment-pilot.yml.
  INSTALLER_SHA_LINUX_8_10: '497f0f518fa4c5f8529269580a6a79366f21315af26cf3ed1ae8b47e05ceac72'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      racket-version:
        description: 'Racket version override (e.g. 8.11, 8.12)'
        required: false
        default: ''
        type: string

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Gate 1: Lint — lightweight, required, fast PR feedback
  # v1.00.26 W1 (§7): the PR-critical path keeps only the governance
  # controller tests and workflow YAML validation. The Racket lint
  # suite (lint-all, version-expectations, lint-alignment, metadata
  # inventory/lint) moved to the parallel `lint-quality` job so
  # downstream jobs (fast-env → test …) no longer wait for Racket lint
  # steps. `lint` and `lint-quality` are both required.
  # ────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Protected governance controller tests
        run: python3 -m unittest discover -s scripts/github -p 'test_*.py'

      - name: Workflow YAML validation
        run: |
          pip install pyyaml
          python3 -c "
          import yaml, glob, sys
          errors = []
          for f in glob.glob('.github/workflows/*.yml'):
            try: yaml.safe_load(open(f))
            except Exception as e: errors.append(f'{f}: {e}')
          for f in glob.glob('.github/actions/*/action.yml'):
            try: yaml.safe_load(open(f))
            except Exception as e: errors.append(f'{f}: {e}')
          if errors:
            for e in errors: print(f'ERROR: {e}')
            sys.exit(1)
          print('All workflows and actions valid YAML')
          "

  lint-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Racket packages
        uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: racket-pkgs-lint-${{ hashFiles('**/info.rkt') }}
          restore-keys: racket-pkgs-lint-
      # W6: stays on the full per-job path BY DESIGN — the W2 topology
      # checkpoint pins that lint-quality and fast-env have no ordering
      # edge in either direction (lint-quality must never wait for the
      # producer). Recorded as deferred in
      # artifacts/proof-graph/v1.00.29-w6/consumers.json.
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}

      - name: Run all lint checks
        run: racket scripts/lint-all.rkt

      # BUG-0009: fail the introducing PR when a test hard-codes the release
      # version instead of deriving it from util/version.rkt (q-version).
      - name: Version expectation lint (no hard-coded version literals in tests)
        run: racket scripts/check-version-expectations.rkt

      - name: Verify lint alignment
        run: racket scripts/check-lint-alignment.rkt

      # Metadata lint (blocking): the repo-owned classifier
      # scripts/run-tests/classify-metadata.rkt is the SINGLE discovery
      # implementation for both local and CI. Both modes invoke the exact
      # same command from the checkout root, so the inventory is identical
      # by construction (invariants I4/I5). Enforcement flipped at v1.00.06
      # (the report-only inventory had to reach zero missing tags first).
      # The W0 known-divergence is RESOLVED: the former wrapper dispatch
      # (`scripts/run-tests.rkt --lint-metadata`) is deleted so no CI-only
      # discovery branch remains; the parity contract is pinned by
      # tests/ci/metadata-discovery-test.rkt + tests/metadata-discovery/fixture/.
      - name: metadata-inventory (artifact)
        run: racket scripts/run-tests/classify-metadata.rkt --metadata-inventory-json > metadata-inventory.json
      - name: Upload metadata inventory
        uses: actions/upload-artifact@v7
        with:
          name: metadata-inventory-${{ github.sha }}
          path: metadata-inventory.json
      - name: metadata-lint (blocking)
        run: racket scripts/run-tests/classify-metadata.rkt --lint-metadata

  # ────────────────────────────────────────────────────────────
  # Gate 1b: Prepared environment producer (v1.00.16 W3 cutover)
  # Builds the immutable per-run artifact (addon-store/ + q-compiled/ +
  # manifest.json) the ubuntu fast-gate `test` shards restore instead of
  # paying per-shard Racket install + raco setup compile cost. The
  # manifest is verified on restore against the job tuple before any
  # test runs (see docs/reports/CI-RACKET-CACHE-POLICY.md). Skipped on
  # workflow_dispatch (racket-version override ⇒ shards fall back to the
  # full path) and by the rollback switch RACKET_PREPARED_ARTIFACT=off.
  # ────────────────────────────────────────────────────────────
  fast-env:
    # v1.00.26 W2 (§7): explicit single-element needs edge — fast-env
    # starts after the lightweight `lint` gate only and runs concurrently
    # with the parallel `lint-quality` job (no ordering edge in either
    # direction; the prepared-environment contract is unchanged).
    needs: [lint]
    if: ${{ github.event_name != 'workflow_dispatch' && vars.RACKET_PREPARED_ARTIFACT != 'off' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-racket-environment
        with:
          racket-version: '8.10'
          installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}
          artifact-name: prepared-env-fast

  # ────────────────────────────────────────────────────────────
  # Gate 2: Sharded test suite — 3 parallel shards on ubuntu (default)
  # Replaces the old single-job full-suite + redundant inter-wave-gate.
  # All 1039+ fast tests still run; sharding cuts wall-clock 3×.
  # W3: shards restore the prepared environment produced by fast-env
  # through the guarded `prepared-environment: auto` input of the
  # setup-racket action (restore + flagged fallback live inside the
  # action, so every call site inherits the same semantics); when the
  # producer is skipped (workflow_dispatch override, rollback switch
  # RACKET_PREPARED_ARTIFACT=off) or the restore mismatches, the shard
  # falls back — loudly, never silently — to the full setup path.
  # Shard count is governed by repo variable FAST_SHARD_COUNT (default
  # 3 = [0, 1, 2]; only the study candidates 4/6/8 widen the matrix —
  # the study and its activation rule are recorded in
  # docs/reports/test-regression-log.md).
  # ────────────────────────────────────────────────────────────
  test:
    needs: [lint, fast-env]
    # Run via the fallback path whenever fast-env is skipped or failed;
    # the guarded restore inside setup-racket plus its fallback marker
    # make that visible.
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # FAST_SHARD_COUNT (W3, guarded study, FAST_SHARD_PLAN
        # precedent): default 3 = today's [0, 1, 2]; only the exact
        # study candidates 4/6/8 change the matrix; any other value
        # (unset, 3, garbage) keeps 3.
        shard: ${{ fromJSON(vars.FAST_SHARD_COUNT == '4' && '[0, 1, 2, 3]' || vars.FAST_SHARD_COUNT == '6' && '[0, 1, 2, 3, 4, 5]' || vars.FAST_SHARD_COUNT == '8' && '[0, 1, 2, 3, 4, 5, 6, 7]' || '[0, 1, 2]') }}
    runs-on: ubuntu-latest
    env:
      # Resolved once so the legacy package-cache step below and the
      # setup-racket call agree: 'auto' only when the prepared path is
      # actually in play for this run (producer green, not a dispatch
      # version-override, rollback switch not off).
      PREPARED_ENV: ${{ (vars.RACKET_PREPARED_ARTIFACT != 'off' && github.event_name != 'workflow_dispatch' && needs.fast-env.result == 'success') && 'auto' || 'off' }}
    steps:
      - uses: actions/checkout@v7
      # Legacy pre-W3 cache; only pays off on the full path.
      - name: Cache Racket packages
        if: env.PREPARED_ENV != 'auto'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: racket-pkgs-test-${{ hashFiles('**/info.rkt') }}
          restore-keys: racket-pkgs-test-
      # setup-racket owns the W3 decision: on PREPARED_ENV=auto it first
      # attempts the manifest-verified prepared-environment restore and,
      # on success, skips install+compile (its step summary reports the
      # restore wall clock in place of the package-visible setup
      # seconds); on any mismatch or failure it falls back to the full
      # path and flags the fallback (::warning + REBUILT summary) —
      # never a silent rebuild.
      - uses: ./.github/actions/setup-racket
        id: setup
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}
          prepared-environment: ${{ env.PREPARED_ENV }}
          prepared-artifact-name: prepared-env-fast
          prepared-installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}

      # W1 telemetry contract: normalize the prepared-environment outcome
      # into machine-readable state for the test runner (runner.rkt reads
      # Q_PREPARED_ENV_STATE / Q_PREPARED_ENV_RESTORE_MS /
      # Q_PREPARED_ENV_FALLBACK_MS when present; local runs report
      # 'unavailable' — never an invented 'restored').
      - name: Export prepared-environment telemetry contract
        shell: bash
        run: |
          echo "Q_PREPARED_ENV_STATE=${{ steps.setup.outputs.prepared-env-state }}" >> "$GITHUB_ENV"
          # W6 review fix: an identity mismatch reroutes to the cold path; the
          # restore-record classifier must see the verdict so the fallback is
          # counted as `rebuilt`/identity-mismatch and never as `verified`.
          echo "Q_PREPARED_ENV_IDENTITY_RESULT=${{ steps.setup.outputs.prepared-env-identity-result }}" >> "$GITHUB_ENV"
          echo "Q_PREPARED_ENV_RESTORE_MS=${{ steps.setup.outputs.prepared-env-restore-ms }}" >> "$GITHUB_ENV"
          echo "Q_PREPARED_ENV_FALLBACK_MS=${{ steps.setup.outputs.prepared-env-fallback-ms }}" >> "$GITHUB_ENV"

      # W5: persist the already-computed restore outcome as a
      # machine-readable record for the warm-observation aggregator.
      # Report wiring only — the guarded restore/fallback semantics
      # inside setup-racket are untouched; this records what happened
      # (state, durations, provenance) so real CI runs can be aggregated
      # honestly, including named fallback causes.
      - name: Emit prepared-environment restore record
        if: always()
        shell: bash
        run: |
          mkdir -p prepared-env-records
          racket scripts/ci/prepared-env-report.rkt \
            --emit-restore-record \
            --out "prepared-env-records/record-${{ github.run_id }}-${{ matrix.shard }}.json" \
            --run-id "${{ github.run_id }}" \
            --head-sha "${{ github.sha }}" \
            --shard "${{ matrix.shard }}" \
            --created-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --fast-env-producer-result "${{ needs.fast-env.result }}" \
            --prepared-artifact-name "prepared-env-fast" \
            --installer-sha256 "${{ env.INSTALLER_SHA_LINUX_8_10 }}"

      - name: Upload prepared-environment restore records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepared-env-records-${{ github.run_id }}-${{ matrix.shard }}
          path: prepared-env-records/
          if-no-files-found: error

      # BUG-0065 systemic (v1.00.29 W4): the shared purge inside
      # setup-racket now runs on EVERY path — including a successful
      # prepared-environment restore, whose .zo extraction timestamps are
      # newer than this checkout (the v1.00.27 cohort-report root cause).
      # This job-level purge is a fail-closed belt between setup and the
      # test run; the invariant is pinned repo-wide by
      # tests/test-workflow-purge-contract.rkt.
      - name: Clear stale bytecode (belt; shared purge lives in setup-racket)
        run: find . -name compiled -type d -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} + 2>/dev/null || true

      # On the prepared-env path the restore action's read-only health
      # checks (racket --version, lock verify, (require quickcheck fmt),
      # raco fmt --help) replace this gate; the purged workspace is
      # lazily recompiled from THIS checkout by the fast suite itself
      # (BUG-0065 systemic invariant — the accepted v1.00.28 release-lane
      # tradeoff, extended to every lane in v1.00.29 W4).
      - name: Compile gate (shared deps)
        if: steps.setup.outputs.prepared-env-result != 'success'
        run: raco make main.rkt

      - name: Run test shard ${{ matrix.shard }}/${{ strategy.job-total }}
        # W7 duration-aware sharding: `active` is evidence-gated. Flip repo
        # variable FAST_SHARD_PLAN=active ONLY after the post-workflow
        # shard-plan-report telemetry (.github/workflows/shard-plan-telemetry.yml)
        # prints `activate` (predicted max-shard duration improves over
        # round-robin with test inventory preserved). Default `off`
        # keeps the round-robin behavior byte-identical.
        env:
          FAST_SHARD_PLAN: ${{ vars.FAST_SHARD_PLAN || 'off' }}
        run: |
          PLAN_ARGS=""
          if [ "$FAST_SHARD_PLAN" = "active" ]; then
            PLAN_ARGS="--shard-plan active"
          fi
          STRICT_TEST_RUNNER=1 racket scripts/run-tests.rkt \
            --suite fast --jobs 4 \
            --shard-index ${{ matrix.shard }} --shard-total ${{ strategy.job-total }} \
            $PLAN_ARGS \
            --json-out test-results.json \
            2>&1 | tee test-output.log

      - name: Test results summary
        if: always()
        run: |
          {
            echo "## Test results — fast shard ${{ matrix.shard }}/${{ strategy.job-total }}"
            if [ -f test-results.json ] && command -v jq >/dev/null 2>&1; then
              jq -r '"- Files: \(.run_summary.file_count)  pass=\(.run_summary.pass) fail=\(.run_summary.fail) timeout=\(.run_summary.timeout) skip=\(.run_summary.skip)",
                     "- Wall clock: \(.run_summary.wall_clock_seconds)s  mode=\(.run_summary.execution_mode)  profile=\(.run_summary.profile)  shard=\(.run_summary.shard)",
                     "- Metadata completeness: explicit=\(.run_summary.metadata_completeness.explicit)/\(.run_summary.file_count) heuristic=\(.run_summary.metadata_completeness.heuristic) missing=\(.run_summary.metadata_completeness.missing)",
                     "",
                     "### Slowest 10 files",
                     (.files | sort_by(-.duration_seconds)[:10][] | "- \(.duration_seconds)s \(.path)")' \
                test-results.json || true
            else
              grep -m1 'RUN-SUMMARY' test-output.log | sed 's/^RUN-SUMMARY /- /' || echo "- (no summary record)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test failure summary
        if: failure()
        run: |
          echo "## Test Shard ${{ matrix.shard }} Failures" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 4 'FAILURE\|ERROR' test-output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-${{ matrix.shard }}
          path: test-output.log
          retention-days: 7

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-fast-${{ matrix.shard }}
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # W5: prepared-environment report — report wiring only, never an
  # activation decision. Aggregates the warm-observation restore records
  # emitted by the test shards into a run-local report (uploaded as
  # evidence, with the verified-restore rate and named fallback causes)
  # and schema-checks the committed baseline manifest with the same
  # aggregator. The prepared-environment decision itself is explicitly
  # reserved for a later reviewed change.
  # ────────────────────────────────────────────────────────────
  prepared-env-report:
    needs: [test, fast-env]
    # W6 expansion: this observational report lane now also consumes the
    # verified prepared environment (same provably-identical tuple), with
    # its own consumer-specific rollback switch (§11.6):
    # RACKET_PREPARED_ENV_REPORT=off pins it to the legacy full path.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      PREPARED_ENV: ${{ (vars.RACKET_PREPARED_ARTIFACT != 'off' && vars.RACKET_PREPARED_ENV_REPORT != 'off' && github.event_name != 'workflow_dispatch' && needs.fast-env.result == 'success') && 'auto' || 'off' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: '8.10'
          prepared-environment: ${{ env.PREPARED_ENV }}
          prepared-artifact-name: prepared-env-fast
          prepared-installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}
      - name: Download shard restore records
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: prepared-env-records-${{ github.run_id }}-*
          path: records-raw
      - name: Stage restore records
        run: |
          mkdir -p prepared-env-records
          find records-raw -name 'record-*.json' -exec cp {} prepared-env-records/ \;
          ls -1 prepared-env-records/ || true
      - name: Aggregate warm-observation window (run-local)
        run: |
          racket scripts/ci/prepared-env-report.rkt \
            --aggregate prepared-env-records \
            --out prepared-env-report-run.json
          cat prepared-env-report-run.json
      - name: Schema-check the committed baseline manifest
        run: |
          racket scripts/ci/prepared-env-report.rkt \
            --manifest artifacts/ci-baseline/v1.00.25-prepared-env/report.json --check
      - name: Upload run-local prepared-env report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepared-env-report-${{ github.run_id }}
          path: prepared-env-report-run.json
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Gate 2b: Test aggregate — required gate that all shards passed
  #
  # v1.00.29 W9 rework (dup-01 removal, review round 1): this job is
  # green only when every fast shard AND the platform checks passed, so
  # it is the single producer of the fast-suite proof bundle. The
  # scheduled nightly test job may then REUSE this proof at the same SHA
  # (same selection, same ubuntu-latest/racket-8.10 environment, same
  # strictness — W0 exact_duplicate dup-01) instead of re-executing the
  # identical suite. The bundle is evidence, not a cached exit code: the
  # consumer re-validates it fail-closed (validator steps 1-15) and runs
  # the suite on ANY consume failure — never a silent skip (§11.3).
  # ────────────────────────────────────────────────────────────
  test-aggregate:
    needs: [test, test-platform]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All test shards and platform checks passed."

      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}

      # The fast shards upload their run-summary JSON as
      # test-results-fast-<shard> (one file per artifact, so no
      # merge-multiple: artifacts land in per-artifact subdirectories).
      - name: Download fast-suite shard results
        uses: actions/download-artifact@v7
        with:
          path: shard-results
          pattern: test-results-fast-*

      # Produces the q.proof-bundle/1 for claim:pr-ci:linux-fast-suite
      # from the per-shard results. N2 (review round 1): the claim's
      # tests_failed/tests_skipped are the REAL aggregated counts; the
      # step FAILS unless every shard reported and the aggregate is clean
      # (zero failures, timeouts and skips), so a bundle over a non-clean
      # aggregate can never exist. Digests are computed over named real
      # inputs; each recipe is recorded in the claim JSON's digest_sources
      # map (annotations only — consume.rkt ignores unknown keys, the
      # validator's closed shapes are untouched). This step only runs on a
      # green aggregate (needs: [test, test-platform] with no always()),
      # so a failed or cancelled shard can never yield a reusable bundle.
      - name: Produce fast-suite proof bundle
        run: |
          set -euo pipefail
          mkdir -p artifacts-run proof-bundle
          SHARD_JSONS="$(find shard-results -name test-results.json | LC_ALL=C sort)"
          if [ -z "$SHARD_JSONS" ]; then
            echo "producer: no shard results downloaded (refusing to write a bundle)" >&2
            exit 1
          fi
          : > artifacts-run/shards.jsonl
          for f in $SHARD_JSONS; do
            jq -c --arg artifact "$(basename "$(dirname "$f")")" \
              '{artifact: $artifact,
                shard: .run_summary.shard,
                file_count: .run_summary.file_count,
                pass: .run_summary.pass,
                fail: .run_summary.fail,
                timeout: .run_summary.timeout,
                skip: .run_summary.skip,
                wall_clock_seconds: .run_summary.wall_clock_seconds}' "$f" >> artifacts-run/shards.jsonl
          done
          jq -s '{
            suite: "fast",
            sharded: true,
            shards: (sort_by(.artifact)),
            file_count: (map(.file_count) | add),
            pass: (map(.pass) | add),
            fail: (map(.fail) | add),
            timeout: (map(.timeout) | add),
            skip: (map(.skip) | add),
            wall_clock_seconds: (map(.wall_clock_seconds) | max),
            elapsed_ms_basis: "max shard wall_clock_seconds; shards execute in parallel so the suite completed when the slowest shard completed"
          }' artifacts-run/shards.jsonl > artifacts-run/fast-suite-results-summary.json
          SUMMARY="artifacts-run/fast-suite-results-summary.json"
          FILE_TOTAL="$(jq '.file_count' "$SUMMARY")"
          PASS_TOTAL="$(jq '.pass' "$SUMMARY")"
          FAIL_TOTAL="$(jq '.fail' "$SUMMARY")"
          TIMEOUT_TOTAL="$(jq '.timeout' "$SUMMARY")"
          SKIP_TOTAL="$(jq '.skip' "$SUMMARY")"
          if [ "$FILE_TOTAL" -eq 0 ] || [ "$FAIL_TOTAL" -ne 0 ] || [ "$TIMEOUT_TOTAL" -ne 0 ] || [ "$SKIP_TOTAL" -ne 0 ]; then
            echo "producer: refusing to write a proof bundle over a non-clean aggregate (files=$FILE_TOTAL fail=$FAIL_TOTAL timeout=$TIMEOUT_TOTAL skip=$SKIP_TOTAL)" >&2
            exit 1
          fi
          echo "producer: clean fast-suite aggregate (files=$FILE_TOTAL pass=$PASS_TOTAL fail=$FAIL_TOTAL timeout=$TIMEOUT_TOTAL skip=$SKIP_TOTAL)"
          WF_REVISION="$(git rev-parse "$GITHUB_SHA":.github/workflows/ci.yml)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMPLETED_AT="$CREATED_AT"
          RESULT_SHA="sha256:$(sha256sum "$SUMMARY" | cut -d' ' -f1)"
          RESULT_SIZE="$(stat -c%s "$SUMMARY")"
          ELAPSED_MS="$(jq '(.wall_clock_seconds * 1000) | floor' "$SUMMARY")"
          START_EPOCH="$(( $(date -u +%s) - ( (ELAPSED_MS + 999) / 1000 ) ))"
          STARTED_AT="$(date -u -d "@${START_EPOCH}" '+%Y-%m-%dT%H:%M:%SZ')"
          INVENTORY_SHA="sha256:$(git ls-files tests | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          racket scripts/run-tests/classify-metadata.rkt --metadata-inventory-json > artifacts-run/metadata-inventory.json
          METADATA_SHA="sha256:$(sha256sum artifacts-run/metadata-inventory.json | cut -d' ' -f1)"
          COVERS_SHA="sha256:$(git grep -h '@covers' -- tests | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          SELECTED_SHA="sha256:$(jq -s '[.[].files[].path] | unique | .[]' $SHARD_JSONS | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          RUNNER_REV="$(git rev-parse "$GITHUB_SHA":scripts/run-tests.rkt)"
          FLAGS_SHA="sha256:$(printf '%s' '--suite fast --jobs 4 --shard-index <shard> --shard-total <total> --json-out test-results.json' | sha256sum | cut -d' ' -f1)"
          LOCK_SHA="sha256:$(sha256sum ci/racket-package-lock.rktd | cut -d' ' -f1)"
          RACKET_BIN="$(readlink -f "$(command -v racket)")"
          RACKET_EXEC_SHA="sha256:$(sha256sum "$RACKET_BIN" | cut -d' ' -f1)"
          RECIPE_SHA="sha256:$(sha256sum .github/actions/setup-racket/action.yml | cut -d' ' -f1)"
          PKGSET_SHA="sha256:$( { raco pkg ls 2>/dev/null || echo pkg-ls-unavailable; } | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          FEATFLAGS_SHA="sha256:$(printf '%s' '1' | sha256sum | cut -d' ' -f1)"
          RELENV_SHA="sha256:$(cat /etc/os-release | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          CHECKOUT_SHA="sha256:$(git ls-files | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          COMPILED_SHA="sha256:$(find . -name '*.zo' -type f -not -path './tests/metadata-discovery/fixture/*' -printf '%p %s\n' 2>/dev/null | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          cat > artifacts-run/claim.json <<'JSON_EOF'
          {
            "created_at": "@@CREATED_AT@@",
            "workflow_path": ".github/workflows/ci.yml",
            "environment_class": "linux-racket-8.10-fast",
            "attestation_digest": "@@CHECKOUT_SHA@@",
            "allowed_consumers": ["workflow:nightly.yml:test"],
            "denied_consumers": [],
            "release_reusable": false,
            "producer": {
              "run_id": "@@RUN_ID@@",
              "run_attempt": @@RUN_ATTEMPT@@,
              "job_id": "@@JOB_ID@@",
              "job_name": "test-aggregate",
              "event": "@@EVENT@@",
              "ref": "@@REF@@",
              "trust_tier": "tier-1"
            },
            "claims": [
              {
                "claim_id": "claim:pr-ci:linux-fast-suite",
                "claim_version": 1,
                "proof_class": "fast",
                "required_environment_class": "linux-racket-8.10-fast",
                "gate_class": "required",
                "result": "pass"
              }
            ],
            "selection": {
              "inventory_digest": "@@INVENTORY_SHA@@",
              "metadata_manifest_digest": "@@METADATA_SHA@@",
              "covers_manifest_digest": "@@COVERS_SHA@@",
              "selected_manifest_digest": "@@SELECTED_SHA@@",
              "selected_count": @@FILE_TOTAL@@,
              "selection_mode": "suite:fast",
              "selector_revision_sha": "@@RUNNER_REV@@",
              "explanation_artifact_digest": "@@RESULT_SHA@@"
            },
            "command": {
              "argv": ["racket", "scripts/run-tests.rkt", "--suite", "fast", "--jobs", "4", "--shard-index", "<shard>", "--shard-total", "<total>", "--json-out", "test-results.json"],
              "cwd_contract": "repo-root",
              "flags_digest": "@@FLAGS_SHA@@",
              "runner_revision_sha": "@@RUNNER_REV@@"
            },
            "environment": {
              "os": "linux",
              "os_version": "24.04",
              "runner_image": "ubuntu-24.04",
              "architecture": "x86_64",
              "racket_version": "8.10",
              "racket_executable_digest": "@@RACKET_EXEC_SHA@@",
              "racket_installer_digest": "@@RECIPE_SHA@@",
              "package_lock_digest": "@@LOCK_SHA@@",
              "resolved_package_set_digest": "@@PKGSET_SHA@@",
              "locale": "C.UTF-8",
              "timezone": "UTC"
            },
            "policy": {
              "test_profile": "fast",
              "security_profile": "strict",
              "sandbox_profile": "none",
              "feature_flags_digest": "@@FEATFLAGS_SHA@@",
              "relevant_environment_digest": "@@RELENV_SHA@@"
            },
            "prepared_environment": {
              "mode": "cold",
              "artifact_digest": "@@CHECKOUT_SHA@@",
              "build_recipe_digest": "@@RECIPE_SHA@@",
              "verification_status": "verified",
              "compiled_cache_digest": "@@COMPILED_SHA@@"
            },
            "result": {
              "status": "pass",
              "started_at": "@@STARTED_AT@@",
              "completed_at": "@@COMPLETED_AT@@",
              "elapsed_ms": @@ELAPSED_MS@@,
              "tests_passed": @@PASS_TOTAL@@,
              "tests_failed": @@FAIL_TOTAL@@,
              "tests_skipped": @@SKIP_TOTAL@@,
              "allowed_skip_reasons": [],
              "timeouts": @@TIMEOUT_TOTAL@@,
              "cancelled": false,
              "retry_count": 0,
              "result_summary_digest": "@@RESULT_SHA@@"
            },
            "artifacts": [
              {
                "name": "fast-suite-results-summary",
                "media_type": "application/json",
                "digest": "@@RESULT_SHA@@",
                "size_bytes": @@RESULT_SIZE@@,
                "store": "evidence-store",
                "store_object_id": "fast-suite-results-summary@@RUN_ID@@"
              }
            ],
            "digest_sources": {
              "note": "annotations for auditors; consume.rkt write ignores unknown claim-document keys",
              "inventory_digest": "sha256 over `git ls-files tests | sort`",
              "metadata_manifest_digest": "sha256 over scripts/run-tests/classify-metadata.rkt --metadata-inventory-json",
              "covers_manifest_digest": "sha256 over sorted `git grep -h '@covers' -- tests` lines",
              "selected_manifest_digest": "sha256 over the executed selection: sorted union of .files[].path across all shard test-results.json",
              "runner_revision_sha": "blob sha of scripts/run-tests.rkt at GITHUB_SHA",
              "racket_executable_digest": "sha256 of the resolved racket executable bytes",
              "racket_installer_digest": "sha256 of .github/actions/setup-racket/action.yml (the pinned provisioning recipe)",
              "package_lock_digest": "sha256 of ci/racket-package-lock.rktd",
              "resolved_package_set_digest": "sha256 over sorted `raco pkg ls` output",
              "feature_flags_digest": "sha256 over the literal '1' — every shard executes with STRICT_TEST_RUNNER=1 (the runner's strict zero-test detection is also on by default)",
              "relevant_environment_digest": "sha256 over sorted /etc/os-release content",
              "flags_digest": "sha256 over the common per-shard argv template; only the <shard>/<total> placeholders vary per shard",
              "prepared_environment.mode": "cold: the workspace was purged (W4) and rebuilt from THIS checkout by the shards' compile gates + suite; when the W3 prepared-environment restore was active it restored a manifest-verified identity-equivalent tuple (W6), so the cold annotation stays the conservative honest baseline",
              "compiled_cache_digest": "sha256 over sorted '*.zo' path+size lines (fixture dir excluded)",
              "attestation_digest": "sha256 over `git ls-files | sort` (checkout manifest attestation)",
              "result_summary_digest": "sha256 of artifacts-run/fast-suite-results-summary.json (the aggregated per-shard counts uploaded as fast-suite-results-summary)"
            }
          }
          JSON_EOF
          sed -i \
            -e "s|@@CREATED_AT@@|${CREATED_AT}|g" \
            -e "s|@@CHECKOUT_SHA@@|${CHECKOUT_SHA}|g" \
            -e "s|@@RUN_ID@@|${GITHUB_RUN_ID}|g" \
            -e "s|@@RUN_ATTEMPT@@|${GITHUB_RUN_ATTEMPT}|g" \
            -e "s|@@JOB_ID@@|${GITHUB_JOB}|g" \
            -e "s|@@EVENT@@|${GITHUB_EVENT_NAME}|g" \
            -e "s|@@REF@@|${GITHUB_REF}|g" \
            -e "s|@@INVENTORY_SHA@@|${INVENTORY_SHA}|g" \
            -e "s|@@METADATA_SHA@@|${METADATA_SHA}|g" \
            -e "s|@@COVERS_SHA@@|${COVERS_SHA}|g" \
            -e "s|@@SELECTED_SHA@@|${SELECTED_SHA}|g" \
            -e "s|@@FILE_TOTAL@@|${FILE_TOTAL}|g" \
            -e "s|@@PASS_TOTAL@@|${PASS_TOTAL}|g" \
            -e "s|@@FAIL_TOTAL@@|${FAIL_TOTAL}|g" \
            -e "s|@@TIMEOUT_TOTAL@@|${TIMEOUT_TOTAL}|g" \
            -e "s|@@SKIP_TOTAL@@|${SKIP_TOTAL}|g" \
            -e "s|@@RUNNER_REV@@|${RUNNER_REV}|g" \
            -e "s|@@RESULT_SHA@@|${RESULT_SHA}|g" \
            -e "s|@@RESULT_SIZE@@|${RESULT_SIZE}|g" \
            -e "s|@@FLAGS_SHA@@|${FLAGS_SHA}|g" \
            -e "s|@@RACKET_EXEC_SHA@@|${RACKET_EXEC_SHA}|g" \
            -e "s|@@RECIPE_SHA@@|${RECIPE_SHA}|g" \
            -e "s|@@LOCK_SHA@@|${LOCK_SHA}|g" \
            -e "s|@@PKGSET_SHA@@|${PKGSET_SHA}|g" \
            -e "s|@@FEATFLAGS_SHA@@|${FEATFLAGS_SHA}|g" \
            -e "s|@@RELENV_SHA@@|${RELENV_SHA}|g" \
            -e "s|@@COMPILED_SHA@@|${COMPILED_SHA}|g" \
            -e "s|@@STARTED_AT@@|${STARTED_AT}|g" \
            -e "s|@@COMPLETED_AT@@|${COMPLETED_AT}|g" \
            -e "s|@@ELAPSED_MS@@|${ELAPSED_MS}|g" \
            artifacts-run/claim.json
          racket scripts/proof-bundle/consume.rkt write \
            --claims-json artifacts-run/claim.json \
            --producer-identity "ci.yml:test-aggregate" \
            --workflow-revision-sha "$WF_REVISION" \
            --commit-sha "$GITHUB_SHA" \
            --tree-sha "$TREE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --retention-days 14 \
            --out proof-bundle/bundle.json
          cp artifacts-run/claim.json proof-bundle/claim.json
          echo "proof bundle: $(jq -r '.bundle_id' proof-bundle/bundle.json)"

      - name: Upload proof bundle (fast)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-bundle-fast
          path: |
            proof-bundle/bundle.json
            proof-bundle/claim.json
          if-no-files-found: ignore
          retention-days: 14

  # v1.00.26 W3: the shard-plan-report job moved OFF the PR critical path.
  # The identical report-only job (same name, same artifact contract:
  # shard-plan-report / shard-plan-report.log / retention 7d, same
  # report content) now runs post-workflow in
  # .github/workflows/shard-plan-telemetry.yml (workflow_run: CI
  # completed + workflow_dispatch), checking out the triggering run's
  # head SHA. DAG checkpoint: artifacts/ci-topology/v1.00.26-w3/dag-checkpoint.json
  # (schema ci-topology/dag-checkpoint@1, label "topology checkpoint —
  # not a cohort"). A failed report run fails that telemetry workflow
  # loudly but can never block or fail this workflow.

  # ────────────────────────────────────────────────────────────
  # Gate 2c: Platform-cross verification
  # Runs only the curated platform-sensitive tests instead
  # of the full 1039-file fast suite.
  # ────────────────────────────────────────────────────────────
  test-platform:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Cache Racket packages
        uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: ${{ runner.os }}-racket-packages-${{ hashFiles('**/info.rkt') }}
          restore-keys: ${{ runner.os }}-racket-packages-
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}

      - name: Clear stale bytecode
        run: find . -name compiled -type d -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} + 2>/dev/null || true

      - name: Compile gate
        run: raco make main.rkt

      - name: Run platform-cross suite
        run: |
          STRICT_TEST_RUNNER=1 racket scripts/run-tests.rkt \
            --suite platform --jobs 4 \
            --json-out test-results.json \
            2>&1 | tee test-output.log

      - name: Test results summary
        if: always()
        run: |
          {
            echo "## Test results — platform subset"
            if [ -f test-results.json ] && command -v jq >/dev/null 2>&1; then
              jq -r '"- Files: \(.run_summary.file_count)  pass=\(.run_summary.pass) fail=\(.run_summary.fail) timeout=\(.run_summary.timeout) skip=\(.run_summary.skip)",
                     "- Wall clock: \(.run_summary.wall_clock_seconds)s  mode=\(.run_summary.execution_mode)  profile=\(.run_summary.profile)  shard=\(.run_summary.shard)",
                     "- Metadata completeness: explicit=\(.run_summary.metadata_completeness.explicit)/\(.run_summary.file_count) heuristic=\(.run_summary.metadata_completeness.heuristic) missing=\(.run_summary.metadata_completeness.missing)",
                     "",
                     "### Slowest 10 files",
                     (.files | sort_by(-.duration_seconds)[:10][] | "- \(.duration_seconds)s \(.path)")' \
                test-results.json || true
            else
              grep -m1 'RUN-SUMMARY' test-output.log | sed 's/^RUN-SUMMARY /- /' || echo "- (no summary record)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Platform failure summary
        if: failure()
        run: |
          echo "## Platform Test Failures" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 4 'FAILURE\|ERROR' test-output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload platform test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-platform-macos
          path: test-output.log
          retention-days: 7

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-platform
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Gate 2d: Racket 8.11 cross-version check (main push only)
  #
  # W0 KNOWN-RED (frozen state, see docs/reports/metadata-before-state-v1.00.11.json):
  #   CI run 32532206128 — this job sets racket-version: '8.11' (below), but
  #   ci/racket-package-lock.rktd pins a single-runtime lock to Racket 8.10 and
  #   ci/verify-racket-package-lock.rkt therefore REJECTS the 8.11 runtime, so
  #   this required gate is red on main. The characterization is pinned by
  #   tests/ci/verify-lock-selection-test.rkt (8.10 accepted / 8.11 known-red
  #   rejected / 8.12 rejected). W0 makes NO job config, lock, or lint change;
  #   the fix lands in W1. This comment block is the only ci.yml change in W0.
  # ────────────────────────────────────────────────────────────
  test-cross-version:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Racket packages
        uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: racket-pkgs-cross-811-${{ hashFiles('**/info.rkt') }}
          restore-keys: racket-pkgs-cross-811-
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: '8.11'

      - name: Clear stale bytecode
        run: find . -name compiled -type d -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} + 2>/dev/null || true

      - name: Compile gate
        run: raco make main.rkt

      - name: Run fast suite (Racket 8.11)
        run: |
          STRICT_TEST_RUNNER=1 racket scripts/run-tests.rkt \
            --suite fast --jobs 4 \
            --json-out test-results.json \
            2>&1 | tee test-output.log

      - name: Test results summary
        if: always()
        run: |
          {
            echo "## Test results — cross-version (Racket 8.11)"
            if [ -f test-results.json ] && command -v jq >/dev/null 2>&1; then
              jq -r '"- Files: \(.run_summary.file_count)  pass=\(.run_summary.pass) fail=\(.run_summary.fail) timeout=\(.run_summary.timeout) skip=\(.run_summary.skip)",
                     "- Wall clock: \(.run_summary.wall_clock_seconds)s  mode=\(.run_summary.execution_mode)  profile=\(.run_summary.profile)  shard=\(.run_summary.shard)",
                     "- Metadata completeness: explicit=\(.run_summary.metadata_completeness.explicit)/\(.run_summary.file_count) heuristic=\(.run_summary.metadata_completeness.heuristic) missing=\(.run_summary.metadata_completeness.missing)",
                     "",
                     "### Slowest 10 files",
                     (.files | sort_by(-.duration_seconds)[:10][] | "- \(.duration_seconds)s \(.path)")' \
                test-results.json || true
            else
              grep -m1 'RUN-SUMMARY' test-output.log | sed 's/^RUN-SUMMARY /- /' || echo "- (no summary record)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cross-version test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-cross-version-811
          path: test-output.log
          retention-days: 7

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-cross-version-811
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Gate 3: Security tier — sandbox/permission/safe-mode tests
  # ────────────────────────────────────────────────────────────
  # W4 (#9592) security-queue hold: W1's cohort C1 decision recorded the
  # security queue promotion as `hold` (zero paired shadow samples across all
  # 20 eligible SHAs, so the roadmap "Security p50 <= 240 s" gate is not
  # evaluable). This required lane keeps the CLI batch default; the only
  # scheduler lever in this repository remains the shadow workflow's
  # repository variable, and rollback to batch is always one lever removal.
  # A future promote must relax the W4 guard pins in
  # tests/test-run-tests-profiles.rkt deliberately — never silently.
  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Racket packages
        uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: racket-pkgs-security-${{ hashFiles('**/info.rkt') }}
          restore-keys: racket-pkgs-security-
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}

      - name: Clear stale bytecode
        run: find . -name compiled -type d -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} + 2>/dev/null || true

      - name: Run security test suite (parallel)
        run: STRICT_TEST_RUNNER=1 racket scripts/run-tests.rkt --suite security --jobs 4 --json-out test-results.json 2>&1 | tee test-output.log

      - name: Test results summary
        if: always()
        run: |
          {
            echo "## Test results — security"
            if [ -f test-results.json ] && command -v jq >/dev/null 2>&1; then
              jq -r '"- Files: \(.run_summary.file_count)  pass=\(.run_summary.pass) fail=\(.run_summary.fail) timeout=\(.run_summary.timeout) skip=\(.run_summary.skip)",
                     "- Wall clock: \(.run_summary.wall_clock_seconds)s  mode=\(.run_summary.execution_mode)  profile=\(.run_summary.profile)  shard=\(.run_summary.shard)",
                     "- Metadata completeness: explicit=\(.run_summary.metadata_completeness.explicit)/\(.run_summary.file_count) heuristic=\(.run_summary.metadata_completeness.heuristic) missing=\(.run_summary.metadata_completeness.missing)",
                     "",
                     "### Slowest 10 files",
                     (.files | sort_by(-.duration_seconds)[:10][] | "- \(.duration_seconds)s \(.path)")' \
                test-results.json || true
            else
              grep -m1 'RUN-SUMMARY' test-output.log | sed 's/^RUN-SUMMARY /- /' || echo "- (no summary record)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-test-output
          path: test-output.log
          retention-days: 7

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-security
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Gate 4: Release dry-run — depends on lint passing.
  # W6 expansion: this lane consumes the same-run fast-env artifact when
  # its environment profile is provably identical, runs via the fallback
  # path whenever fast-env is skipped or failed (guarded restore + fallback
  # marker in setup-racket make that visible), and carries a
  # consumer-specific §11.6 rollback switch: setting the repository
  # variable RACKET_PREPARED_RELEASE_DRY_RUN to off pins this job to the
  # legacy full path without touching any other consumer.
  # ────────────────────────────────────────────────────────────
  release-dry-run:
    needs: [lint, fast-env]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PREPARED_ENV: ${{ (vars.RACKET_PREPARED_ARTIFACT != 'off' && vars.RACKET_PREPARED_RELEASE_DRY_RUN != 'off' && github.event_name != 'workflow_dispatch' && needs.fast-env.result == 'success') && 'auto' || 'off' }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Racket packages
        if: env.PREPARED_ENV != 'auto'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: racket-pkgs-release-${{ hashFiles('**/info.rkt') }}
          restore-keys: racket-pkgs-release-
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}
          prepared-environment: ${{ env.PREPARED_ENV }}
          prepared-artifact-name: prepared-env-fast
          prepared-installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}

      - name: Build tarball (dry-run)
        run: |
          VERSION=0.99.74
          TAG_OBJECT=de0ce7391b4ae23818534b31431f00465241302e
          PEELED=32718281aafd378fca511b4294d3c5668134673c
          git fetch --force origin refs/tags/v0.99.74:refs/tags/v0.99.74
          test "$(git rev-parse v0.99.74)" = "$TAG_OBJECT"
          test "$(git rev-parse 'v0.99.74^{}')" = "$PEELED"
          git archive --format=tar --prefix=q/ "$PEELED" | gzip -n > /tmp/q-${VERSION}.tar.gz
          echo "Tarball size: $(du -h /tmp/q-${VERSION}.tar.gz | cut -f1)"

      - name: Verify manifest generation
        env:
          Q_RELEASE_DATE: '2026-07-29'
          Q_RELEASE_WORKFLOW_RUN_ID: ci-release-dry-run
          Q_RELEASE_WORKFLOW_RUN_URL: https://github.com/coinerd/q/actions/workflows/ci.yml
          Q_RELEASE_WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
          Q_RELEASE_TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          VERSION=0.99.74
          TAG_OBJECT=de0ce7391b4ae23818534b31431f00465241302e
          PEELED=32718281aafd378fca511b4294d3c5668134673c
          racket scripts/gen-release-manifest.rkt \
            --version "$VERSION" --tag v0.99.74 --commit "$PEELED" \
            --tag-commit "$PEELED" --tag-object "$TAG_OBJECT" \
            /tmp/q-${VERSION}.tar.gz > /tmp/manifest.json
          racket scripts/verify-release-bundle.rkt \
            --version "$VERSION" --tag v0.99.74 --commit "$PEELED" --tag-object "$TAG_OBJECT" \
            /tmp/q-${VERSION}.tar.gz /tmp/manifest.json

      - name: Verify release notes generation
        run: |
          VERSION=$(racket -e '(require "util/version.rkt") (display q-version)')
          racket scripts/gen-release-notes.rkt "${VERSION}" > /tmp/notes.md
          echo "Release notes generated ($(wc -l < /tmp/notes.md) lines)"

  # ────────────────────────────────────────────────────────────
  # Gate 5: Smoke — depends on lint only (not test)
  # ────────────────────────────────────────────────────────────
  smoke:
    needs: [lint, fast-env]
    # W6: run via the fallback path whenever fast-env is skipped or failed.
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # W6 expansion: consumer-specific rollback switch (§11.6) — set
      # RACKET_PREPARED_SMOKE=off to pin this job to the legacy full path.
      PREPARED_ENV: ${{ (vars.RACKET_PREPARED_ARTIFACT != 'off' && vars.RACKET_PREPARED_SMOKE != 'off' && github.event_name != 'workflow_dispatch' && needs.fast-env.result == 'success') && 'auto' || 'off' }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Racket packages
        if: env.PREPARED_ENV != 'auto'
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/racket
          key: racket-pkgs-smoke-${{ matrix.os }}-${{ hashFiles('**/info.rkt') }}
          restore-keys: racket-pkgs-smoke-${{ matrix.os }}-
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}
          prepared-environment: ${{ env.PREPARED_ENV }}
          prepared-artifact-name: prepared-env-fast
          prepared-installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}

      - name: Clear stale bytecode
        run: find . -name compiled -type d -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} + 2>/dev/null || true

      - name: Version smoke check
        run: |
          output=$(racket main.rkt --version)
          echo "$output"
          echo "$output" | grep -qE '^q version [0-9]+\.[0-9]+\.[0-9]+$'

      - name: Help smoke check
        run: |
          output=$(racket main.rkt --help)
          echo "$output"
          echo "$output" | grep -qE '^Usage:'

      - name: Provider compilation smoke tests
        run: raco test tests/test-provider-smoke.rkt

  # ────────────────────────────────────────────────────────────
  # Gate 6: Workflow integration suite (2-way sharded, parallel)
  # ────────────────────────────────────────────────────────────
  workflows:
    needs: [lint, fast-env]
    # W6: run via the fallback path whenever fast-env is skipped or failed.
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    env:
      # W6 expansion: consumer-specific rollback switch (§11.6) — set
      # RACKET_PREPARED_WORKFLOWS=off to pin both shards to the legacy
      # full path without touching any other consumer.
      PREPARED_ENV: ${{ (vars.RACKET_PREPARED_ARTIFACT != 'off' && vars.RACKET_PREPARED_WORKFLOWS != 'off' && github.event_name != 'workflow_dispatch' && needs.fast-env.result == 'success') && 'auto' || 'off' }}
    # W4 (v1.00.26 §7) decision: HOLD. Workflow shards keep the product-default
    # batch scheduler. CI measurement on the wave branch (2 queue runs, one
    # 30-minute window) showed shard p50s ~9-25% above the 5-run batch baseline
    # and was contention-confounded — not reliable enough to activate queue.
    # Targets were not revised; the TEST_RUNNER_SCHEDULER env seam stays
    # available runner-side for a future measured re-trial, and unsetting the
    # variable restores this default everywhere.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}
          prepared-environment: ${{ env.PREPARED_ENV }}
          prepared-artifact-name: prepared-env-fast
          prepared-installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}

      - name: Clear stale bytecode
        run: find . -name compiled -type d -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} + 2>/dev/null || true

      - name: Workflow integration suite shard ${{ matrix.shard }}/2
        run: |
          STRICT_TEST_RUNNER=1 racket scripts/run-tests.rkt \
            --suite workflows --jobs 2 --timeout 90 \
            --shard-index ${{ matrix.shard }} --shard-total 2 \
            --json-out test-results.json \
            2>&1 | tee workflow-output.log

      - name: Test results summary
        if: always()
        run: |
          {
            echo "## Test results — workflows shard ${{ matrix.shard }}/2"
            if [ -f test-results.json ] && command -v jq >/dev/null 2>&1; then
              jq -r '"- Files: \(.run_summary.file_count)  pass=\(.run_summary.pass) fail=\(.run_summary.fail) timeout=\(.run_summary.timeout) skip=\(.run_summary.skip)",
                     "- Wall clock: \(.run_summary.wall_clock_seconds)s  mode=\(.run_summary.execution_mode)  profile=\(.run_summary.profile)  shard=\(.run_summary.shard)",
                     "- Metadata completeness: explicit=\(.run_summary.metadata_completeness.explicit)/\(.run_summary.file_count) heuristic=\(.run_summary.metadata_completeness.heuristic) missing=\(.run_summary.metadata_completeness.missing)",
                     "",
                     "### Slowest 10 files",
                     (.files | sort_by(-.duration_seconds)[:10][] | "- \(.duration_seconds)s \(.path)")' \
                test-results.json || true
            else
              grep -m1 'RUN-SUMMARY' workflow-output.log | sed 's/^RUN-SUMMARY /- /' || echo "- (no summary record)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Workflow failure summary
        if: failure()
        run: |
          echo "## Workflow Test Failures (shard ${{ matrix.shard }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 4 'FAILURE\|ERROR' workflow-output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload workflow log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-test-output-${{ matrix.shard }}
          path: workflow-output.log
          retention-days: 7

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-workflows-${{ matrix.shard }}
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Gate 6b: Workflows aggregate — required gate that all workflow shards passed
  # ────────────────────────────────────────────────────────────
  workflows-aggregate:
    needs: [workflows]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All workflow shards passed."

  # ────────────────────────────────────────────────────────────
  # Gate 7: GSD wave evidence (current protected wave)
  # A single-record push receives strict per-wave validation. Aggregate pushes
  # may carry several independently retained wave records, whose individual
  # content digests cannot be reconstructed from the aggregate merge diff.
  # ────────────────────────────────────────────────────────────
  gsd-governance:
    # W6: run via the fallback path whenever fast-env is skipped or failed.
    if: ${{ github.event_name == 'push' && !cancelled() && needs.lint.result == 'success' }}
    needs: [lint, fast-env]
    runs-on: ubuntu-latest
    env:
      # W6 expansion: consumer-specific rollback switch (§11.6) — set
      # RACKET_PREPARED_GSD_GOVERNANCE=off to pin this job to the legacy
      # full path without touching any other consumer.
      PREPARED_ENV: ${{ (vars.RACKET_PREPARED_ARTIFACT != 'off' && vars.RACKET_PREPARED_GSD_GOVERNANCE != 'off' && github.event_name != 'workflow_dispatch' && needs.fast-env.result == 'success') && 'auto' || 'off' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}
          prepared-environment: ${{ env.PREPARED_ENV }}
          prepared-artifact-name: prepared-env-fast
          prepared-installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}

      - name: Validate machine-checkable wave evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/reports/gsd-wave-evidence"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            base_sha="origin/${{ github.base_ref }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi
          mapfile -t evidence_files < <(
            git diff --name-only "$base_sha...$head_sha" -- "$evidence_dir/*.rktd"
          )
          if [[ ${#evidence_files[@]} -eq 0 ]]; then
            echo "No wave evidence record changed — skipping validation."
            exit 0
          fi
          if [[ ${#evidence_files[@]} -gt 1 ]]; then
            echo "Multiple wave evidence records changed (${#evidence_files[@]}); skipping per-wave digest validation for this aggregate push."
            printf '  %s\n' "${evidence_files[@]}"
            exit 0
          fi
          evidence="${evidence_files[0]}"
          content_digest=$(
            git diff --binary "$base_sha...$head_sha" -- . \
              ':(exclude)docs/reports/gsd-wave-evidence/**' \
              ':(exclude)docs/reports/gsd-wave-reviews/**' \
              ':(exclude)docs/reports/gsd-wave-validation/**' \
              | sha256sum | awk '{print $1}'
          )
          racket scripts/gsd-wave-gate.rkt "$evidence" \
            --content-digest "$content_digest" \
            --root . \
            --policy scripts/required-pr-checks.policy

  # ────────────────────────────────────────────────────────────
  # Gate 8: Abstraction audit (non-blocking, informational)
  # Runs on every push/PR — reports but does not fail the build.
  # ────────────────────────────────────────────────────────────
  abstraction-audit:
    needs: [lint, fast-env]
    # W6: run via the fallback path whenever fast-env is skipped or failed.
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # W6 expansion: consumer-specific rollback switch (§11.6) — set
      # RACKET_PREPARED_ABSTRACTION_AUDIT=off to pin this job to the
      # legacy full path without touching any other consumer.
      PREPARED_ENV: ${{ (vars.RACKET_PREPARED_ARTIFACT != 'off' && vars.RACKET_PREPARED_ABSTRACTION_AUDIT != 'off' && github.event_name != 'workflow_dispatch' && needs.fast-env.result == 'success') && 'auto' || 'off' }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Racket packages
        if: env.PREPARED_ENV != 'auto'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/racket
          key: racket-pkgs-audit-${{ hashFiles('**/info.rkt') }}
          restore-keys: racket-pkgs-audit-
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}
          prepared-environment: ${{ env.PREPARED_ENV }}
          prepared-artifact-name: prepared-env-fast
          prepared-installer-sha256: ${{ env.INSTALLER_SHA_LINUX_8_10 }}

      - name: Clear stale bytecode
        run: find . -name compiled -type d -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} + 2>/dev/null || true

      - name: Run abstraction audit (CI mode)
        run: |
          racket scripts/abstraction-audit.rkt --ci-mode 2>&1 | tee audit-output.log

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abstraction-audit-report
          path: audit-output.log
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Gate 9: Release-readiness check (tag pushes only)
  # ────────────────────────────────────────────────────────────
  release-readiness:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ github.event.inputs.racket-version || '8.10' }}

      - name: Run fast suite with gate evidence
        run: racket scripts/run-tests.rkt --suite fast --record-gate-evidence --json-out test-results-fast.json 2>&1 | tee gate-fast.log

      - name: Run TUI suite with gate evidence
        run: racket scripts/run-tests.rkt --suite tui --record-gate-evidence --json-out test-results-tui.json 2>&1 | tee gate-tui.log

      - name: Run arch suite with gate evidence
        run: racket scripts/run-tests.rkt --suite arch --record-gate-evidence --json-out test-results-arch.json 2>&1 | tee gate-arch.log

      - name: Run workflows suite with gate evidence
        run: racket scripts/run-tests.rkt --suite workflows --record-gate-evidence --json-out test-results-workflows.json 2>&1 | tee gate-workflows.log

      - name: Gate evidence summary
        if: always()
        run: |
          {
            for suite in fast tui arch workflows; do
              echo "## Gate evidence — $suite"
              f="test-results-$suite.json"
              if [ -f "$f" ] && command -v jq >/dev/null 2>&1; then
                jq -r '"- Files: \(.run_summary.file_count)  pass=\(.run_summary.pass) fail=\(.run_summary.fail) timeout=\(.run_summary.timeout) skip=\(.run_summary.skip)",
                       "- Wall clock: \(.run_summary.wall_clock_seconds)s  mode=\(.run_summary.execution_mode)",
                       "- Metadata completeness: explicit=\(.run_summary.metadata_completeness.explicit) heuristic=\(.run_summary.metadata_completeness.heuristic) missing=\(.run_summary.metadata_completeness.missing)"' "$f" || true
              else
                grep -m1 'RUN-SUMMARY' "gate-$suite.log" | sed 's/^RUN-SUMMARY /- /' || echo "- (no summary record)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate-evidence JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-gate-evidence
          path: test-results-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Strict release readiness check
        run: racket scripts/lint-release-readiness.rkt --strict

      - name: Triple-gate (3x full suite)
        run: racket scripts/run-tests.rkt --repeat 3 2>&1 | tee triple-gate.log

      - name: Triple-gate summary
        if: always()
        run: |
          echo "## Triple-Gate Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 triple-gate.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

