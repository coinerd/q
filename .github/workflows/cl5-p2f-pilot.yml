name: CL5 P2-F host-comparability pilot (evaluation only)

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: 'Dispatch head SHA (must match github.sha)'
        required: true
        type: string
      budget-id:
        description: 'Frozen dispatch budget id'
        required: true
        type: string
      attempt:
        description: 'Attempt number within the frozen budget'
        required: true
        type: choice
        options: ['1', '2']

permissions:
  contents: read
  actions: read

concurrency:
  group: cl5-p2f-pilot-rev1-${{ inputs.source-sha }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    # Eight files sum to ~670 s of CI elapsed. Worst case (no overlap at all)
    # six invocations are 4020 s = 67 min; 120 min leaves room without turning
    # a job timeout into a measurement sample.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The tree pin diffs against the frozen SHA, so the checkout needs its
          # history. A depth-1 checkout makes that SHA unresolvable (exit 128).
          fetch-depth: 0

      - name: Bind the pinned tree and budget
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          BUDGET_ID: ${{ inputs.budget-id }}
          ATTEMPT: ${{ inputs.attempt }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PINNED_SHA: dd5c9995fc13bbc1253995768b2d78c4531e0a60
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$DISPATCH_SHA"
          echo "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$BUDGET_ID" = 'CL5-P2F-REV1'
          case "$ATTEMPT" in 1|2) ;; *) echo 'bad attempt' >&2; exit 1;; esac
          git merge-base --is-ancestor "$PINNED_SHA" HEAD
          # The workflow must live on the default branch to be dispatchable by
          # filename, so the tested tree is pinned by diffing against the frozen
          # SHA instead of by checking the parent commit.
          allowed='.github/workflows/cl5-p2f-pilot.yml
          README.md
          artifacts/tier-ownership/v1.00.32-w0/ownership-matrix.json
          docs/reports/CL5-P2F-REVISED-DESIGN.md
          docs/reports/CL5-P2F-REVISED-PILOT-WORKFLOW.md
          docs/reports/CL5-P2F-REVISED-WORKLOAD.json
          tests/test-cl5-p2f-revised.rkt'
          actual="$(git diff --name-only "$PINNED_SHA" HEAD)"
          test "$actual" = "$allowed"
          mkdir -p cl5-p2f
          printf 'budget_id=%s\nattempt=%s\ndispatch_sha=%s\nworkflow_sha=%s\npinned_sha=%s\n' \
            "$BUDGET_ID" "$ATTEMPT" "$DISPATCH_SHA" "$WORKFLOW_SHA" "$PINNED_SHA" \
            > cl5-p2f/provenance.txt

      # This isolated job has no same-run prepared-environment producer, so the
      # guarded restore would always be skipped. Opt out EXPLICITLY and record
      # the action's own outputs; never read Q_PREPARED_ENV_* env vars that the
      # action never exports.
      - uses: ./.github/actions/setup-racket
        id: setup
        with:
          racket-version: '8.10'
          prepared-environment: 'off'

      - name: Record the measurement environment
        env:
          SETUP_STATE: ${{ steps.setup.outputs.prepared-env-state }}
          SETUP_RESTORE_MS: ${{ steps.setup.outputs.prepared-env-restore-ms }}
          SETUP_FALLBACK_MS: ${{ steps.setup.outputs.prepared-env-fallback-ms }}
          SETUP_DURATION_S: ${{ steps.setup.outputs.eager-setup-seconds }}
          CACHE_STATE: ${{ steps.setup.outputs.cache-state }}
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          {
            printf 'date=%s\n' "$(date -Is)"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'os_id=%s\n' "$ID"
            printf 'os_version_id=%s\n' "$VERSION_ID"
            printf 'os_pretty_name=%s\n' "$PRETTY_NAME"
            printf 'arch=%s\n' "$(uname -m)"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH:-}"
            printf 'runner_name=%s\n' "${RUNNER_NAME:-}"
            printf 'image_os=%s\n' "${ImageOS:-}"
            printf 'image_version=%s\n' "${ImageVersion:-}"
            printf 'cpu_count=%s\n' "$(nproc)"
            printf 'cpu_model=%s\n' "$(grep -m1 'model name' /proc/cpuinfo)"
            printf 'memory_kb=%s\n' "$(awk '/^MemTotal:/{print $2; exit}' /proc/meminfo)"
            printf 'cpu_max=%s\n' "$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable)"
            printf 'kernel_release=%s\n' "$(cat /proc/sys/kernel/osrelease)"
            printf 'load_before=%s\n' "$(cat /proc/loadavg)"
            printf 'racket_version=%s\n' "$(racket --version)"
            printf 'racket_exe_sha256=%s\n' "$(sha256sum "$(command -v racket)" | cut -d' ' -f1)"
            printf 'prepared_env_state=%s\n' "$SETUP_STATE"
            printf 'prepared_restore_ms=%s\n' "${SETUP_RESTORE_MS:-empty}"
            printf 'prepared_fallback_ms=%s\n' "${SETUP_FALLBACK_MS:-empty}"
            printf 'setup_duration_s=%s\n' "${SETUP_DURATION_S:-empty}"
            printf 'racket_addon_cache_state=%s\n' "$CACHE_STATE"
          } > cl5-p2f/environment.txt

      - name: Validate measured host before measurement
        shell: bash
        run: |
          set -euo pipefail
          get() {
            awk -F= -v k="$1" '$1 == k { print substr($0, index($0, "=") + 1); exit }' \
              cl5-p2f/environment.txt
          }
          bad=0
          require() {
            local value="$1" expected="$2" field="$3"
            if [ "$value" != "$expected" ]; then
              printf 'HOST MISMATCH %s: observed=%q expected=%q\n' "$field" "$value" "$expected" >&2
              bad=1
            fi
          }
          require "$(get os_id)" 'ubuntu' os_id
          require "$(get os_version_id)" '26.04' os_version_id
          require "$(get os_pretty_name)" 'Ubuntu 26.04.1 LTS' os_pretty_name
          require "$(get image_os)" 'ubuntu26' image_os
          require "$(get image_version)" '20261122.9.1' image_version
          require "$(get arch)" 'x86_64' arch
          require "$(get runner_arch)" 'X64' runner_arch
          require "$(get cpu_count)" '4' cpu_count
          require "$(get racket_exe_sha256)" \
            '7674f17865fa795b21641828d839e689e01a2f17bbdd2b7d71cc59cceafa873c' \
            racket_exe_sha256
          case "$(get cpu_model)" in *'AMD EPYC 9V'*) ;; *)
            printf 'HOST MISMATCH cpu_model: %s\n' "$(get cpu_model)" >&2; bad=1;;
          esac
          case "$(get racket_version)" in *'8.10'*) ;; *)
            printf 'HOST MISMATCH racket_version: %s\n' "$(get racket_version)" >&2; bad=1;;
          esac
          mem="$(get memory_kb)"
          if ! awk -v m="$mem" 'BEGIN { exit !(m >= 15500000 && m <= 17500000) }'; then
            printf 'HOST MISMATCH memory_kb: %s\n' "$mem" >&2; bad=1
          fi
          cpu_max="$(get cpu_max)"
          if [ -n "$cpu_max" ] && [ "$cpu_max" != 'unavailable' ] && [ "$cpu_max" != 'max' ]; then
            read -r quota period <<<"$cpu_max"
            if ! awk -v q="$quota" -v p="$period" 'BEGIN { exit !(q / p >= 4) }'; then
              printf 'HOST MISMATCH cpu_max: %s\n' "$cpu_max" >&2; bad=1
            fi
          fi
          test "$bad" -eq 0

      - name: Materialise the frozen workload
        shell: bash
        run: |
          set -euo pipefail
          echo "cdba4c1a62ac9e3c572a03fb3eb8b495eea74ce9e86b6e4e35d132e1e10abe70  docs/reports/CL5-P2F-REVISED-WORKLOAD.json" | sha256sum -c -
          racket -e '(require json) (define d (call-with-input-file "docs/reports/CL5-P2F-REVISED-WORKLOAD.json" read-json)) (unless (equal? (hash-ref d (quote schema)) "cl5-p2f-workload/2") (error "bad workload schema")) (unless (equal? (hash-ref d (quote pinned_test_tree_sha)) "dd5c9995fc13bbc1253995768b2d78c4531e0a60") (error "bad pinned tree")) (unless (= (length (hash-ref d (quote files))) 8) (error "bad file count")) (for ([f (in-list (hash-ref d (quote files)))]) (displayln (hash-ref f (quote path))))' > cl5-p2f/files.txt
          test "$(wc -l < cl5-p2f/files.txt)" -eq 8

      - name: Warm-up and five measured invocations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < cl5-p2f/files.txt
          : > cl5-p2f/schedule.txt
          for i in 0 1 2 3 4 5; do
            printf 'load_before_run_%s=%s\n' "$i" "$(cat /proc/loadavg)" >> cl5-p2f/schedule.txt
            argv="racket scripts/run-tests/runner.rkt --jobs 4 --json-out cl5-p2f/run-$i.json ${FILES[*]}"
            printf 'argv_run_%s=%s\n' "$i" "$argv" >> cl5-p2f/schedule.txt
            start=$(date +%s%3N)
            rc=0
            racket scripts/run-tests/runner.rkt \
              --jobs 4 --json-out "cl5-p2f/run-$i.json" "${FILES[@]}" \
              > "cl5-p2f/run-$i.log" 2>&1 || rc=$?
            end=$(date +%s%3N)
            printf 'run=%s wall_ms=%s rc=%s\n' "$i" "$((end-start))" "$rc" \
              >> cl5-p2f/schedule.txt
            test "$rc" -eq 0
          done
          printf 'load_after=%s\n' "$(cat /proc/loadavg)" >> cl5-p2f/schedule.txt

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cl5-p2f-pilot-rev1
          path: cl5-p2f/
          if-no-files-found: error
