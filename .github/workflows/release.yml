name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'

# BUG-0045: a tag pushed twice (or a re-fired duplicate push event)
# starts two Release runs off the same ref within seconds. Without
# serialization both runs build, draft, and try to publish, and the
# loser's undraft PATCH fails with HTTP 422 once the winner has bound
# the tag — leaving a red run and an untagged draft for manual cleanup
# (v1.00.20: runs 33037947829 / 33038023671 ~90 s apart). Keying the
# group on the pushed tag ref serializes runs per tag (runs for
# different tags stay independent), and cancel-in-progress makes a
# duplicate trigger cancel the older run instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Preflight: cheap structural checks in seconds (BUG-0007 fail-fast),
  #    plus release readiness (BUG-0008). Runs before any expensive job, so
  #    metadata errors (lightweight tag, tag/version mismatch, manifest
  #    surface, missing required fixes) never cost a full suite run. ──
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # BUG-0008 readiness: read the v<version> milestone's BUG-NNNN issues.
      issues: read
    env:
      # BUG-0008 readiness: milestone query credentials (registry fallback
      # lives outside this repo, so in CI the milestone is the tracker source).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # fetch-tags: the tag OBJECT must be present locally for
          # `git cat-file -t` to tell annotated from lightweight tags.
          # fetch-depth 0: readiness runs `git merge-base --is-ancestor
          # <fix-sha> <tagged-sha>`, so the history containing the required
          # fixes' landing commits must be present locally.
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-racket

      - name: Release preflight (tag/version/manifest invariants + required-fix readiness)
        run: racket scripts/release-preflight.rkt ${{ github.ref_name }} --readiness

  # ── Pre-publication gates (runs before any build) ──
  test:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-racket

      - name: Version consistency check
        run: racket scripts/lint-version.rkt

      - name: Run tests (fast suite)
        id: fast-tests
        run: |
          set -o pipefail
          racket scripts/run-tests.rkt --suite fast --timeout 300 --record-gate-evidence 2>&1 | tee test-output.log

      - name: Record gate evidence (arch)
        run: |
          set -o pipefail
          racket scripts/run-tests.rkt --suite arch --record-gate-evidence 2>&1 | tee -a test-output.log

      - name: Record gate evidence (workflows)
        run: |
          set -o pipefail
          racket scripts/run-tests.rkt --suite workflows --jobs 4 --timeout 90 --record-gate-evidence 2>&1 | tee -a test-output.log

      - name: Record gate evidence (tui)
        run: |
          set -o pipefail
          racket scripts/run-tests.rkt --suite tui --jobs 4 --timeout 60 --record-gate-evidence 2>&1 | tee -a test-output.log

      - name: Strict release readiness
        run: |
          set -o pipefail
          racket scripts/lint-release-readiness.rkt --strict --context tag-publish 2>&1 | tee release-readiness.log
          echo "## Release Readiness" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat release-readiness.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Test failure summary
        if: failure()
        run: |
          echo "## Test Failures" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 4 'FAILURE\|ERROR\|FAILED\|TIMEOUT' test-output.log release-readiness.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-output-release
          path: |
            test-output.log
            release-readiness.log
          retention-days: 7

  # ── Extract version from tag ──
  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      checkout-ref: ${{ steps.checkout.outputs.CHECKOUT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-racket

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Version context diagnostics
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CANONICAL=$(racket -e '(require "util/version.rkt") (display q-version)')
          echo "=== Release Context ==="
          echo "GITHUB_REF:       ${GITHUB_REF}"
          echo "GITHUB_SHA:       ${GITHUB_SHA}"
          echo "Tag version:      ${VERSION}"
          echo "Canonical q-ver:  ${CANONICAL}"
          echo "Readiness ctx:    tag-publish"
          echo "=== End Release Context ==="

      - name: Verify version consistency
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CANONICAL=$(racket -e '(require "util/version.rkt") (display q-version)')
          echo "Tag version: $VERSION"
          echo "Canonical:   $CANONICAL"
          [ "$VERSION" = "$CANONICAL" ]

      - name: Lint release notes (mandatory)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          racket scripts/lint-release-notes.rkt --version "${VERSION}" --check

      - name: Architecture policy integrity check
        run: |
          echo "=== Architecture Policy Integrity Guard ==="
          racket scripts/release-integrity-guard.rkt --validate-rktd
          racket scripts/release-integrity-guard.rkt --snapshot > /tmp/arch-integrity-snapshot.json
          echo "Snapshot captured: $(wc -l < /tmp/arch-integrity-snapshot.json) artifacts"
          echo "All protected architecture-policy artifacts are byte-stable and syntactically valid."

      - name: Upload integrity snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arch-integrity-snapshot-${{ steps.version.outputs.VERSION }}
          path: /tmp/arch-integrity-snapshot.json
          retention-days: 30

      - name: Determine checkout ref
        id: checkout
        run: |
          echo "CHECKOUT_REF=${GITHUB_SHA}" >> $GITHUB_OUTPUT

  # ── Build once, smoke, draft, verify, publish, verify ──
  release-core:
    needs: prepare
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-core.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      checkout-ref: ${{ needs.prepare.outputs.checkout-ref }}
