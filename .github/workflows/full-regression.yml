name: full-regression

# W8: Scheduled/manual full regression. The PR gate is deliberately fast and
# statically sharded (impact selection is opt-in local-only — never a CI gate,
# see docs/TEST_CONVENTIONS.md); this workflow is the definitive execution and
# evidence source for the slow/full/profile-aware suites.
# Status semantics (W0 schema): pass | fail | timeout | skip. A timed-out
# shard fails the whole run with status "timeout" — never success.
# Release linkage: release readiness depends on this workflow's evidence (a
# scheduled run's run-summary.json or a fresh manual dispatch), never on a
# green fast gate alone. See docs/operations/test-regression-triage.md.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "30 2 * * *" # nightly, 02:30 UTC — full regression (heavy jobs)
    # W1 (#9949): the Racket 8.11 compatibility lane below fires on THIS
    # weekly cron only. `github.event.schedule` carries the exact cron
    # string, so the nightly run leaves the compat lane skipped and the
    # compatibility verification runs once a week (plus every manual
    # dispatch). Per-push full-suite 8.11 execution was removed from ci.yml.
    - cron: "40 2 * * 6" # weekly, Saturday 02:40 UTC — Racket 8.11 compatibility
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run (all | broad | slow | tui | ...)"
        required: false
        default: "all"
      profile:
        description: "Execution profile (local | vps | ci | headless | full)"
        required: false
        default: "ci"
      jobs-per-shard:
        description: "Parallel jobs inside each shard"
        required: false
        default: "4"
      extra-args:
        description: "Extra args for ./qt"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: full-regression
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # Main matrix: the full/broad suite, sharded across runners.
  # Static 6-shard matrix works identically for schedule and dispatch.
  # ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # explicit per-shard budget; a timed-out shard fails the run (never success)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: test shard ${{ matrix.shard }}/6
    env:
      SUITE: ${{ github.event.inputs.suite || 'all' }}
      PROFILE: ${{ github.event.inputs.profile || 'ci' }}
      JOBS: ${{ github.event.inputs.jobs-per-shard || '4' }}
      EXTRA_ARGS: ${{ github.event.inputs.extra-args }}
    steps:
      - uses: actions/checkout@v7
        with:
          # History-dependent owners (e.g. test-wave-integrity-adversarial)
          # resolve pinned historical commits; the default shallow clone
          # cannot see them. Same precedent as ci.yml's workflows job.
          fetch-depth: 0

      - uses: ./.github/actions/setup-racket
        with:
          racket-version: "8.10"

      - name: Clear stale bytecode
        run: find . -name compiled -type d -exec rm -rf {} + 2>/dev/null

      - name: Compile gate
        run: raco make main.rkt

      - name: Run shard ${{ matrix.shard }}/6
        run: |
          set -euo pipefail
          mkdir -p shard-results
          LEDGER_ARGS=()
          if [ -f .github/known-failures.json ]; then
            LEDGER_ARGS=(--ledger .github/known-failures.json)
          fi
          # shellcheck disable=SC2086
          # W1 (#9949) repair: the invocation must be the explicit `full`
          # command. Bare `./qt --suite ...` dispatches to the default PR
          # lane, which refuses CI-surface flags ("qt: default does not
          # accept CI-surface option --suite") — every shard of runs
          # 44286441007 failed on exactly that message. `--suite` is a
          # `full`-command flag; `--lane` stays out because a lane is a
          # suite union and this matrix owns the shard via --shard-*.
          # Pinned by tests/test-full-regression-invocation.rkt.
          STRICT_TEST_RUNNER=1 ./qt full \
            --suite "$SUITE" \
            --jobs "$JOBS" \
            --shard-index ${{ matrix.shard }} --shard-total 6 \
            --profile "$PROFILE" \
            "${LEDGER_ARGS[@]}" \
            --json-out shard-results/shard-${{ matrix.shard }}.json \
            $EXTRA_ARGS \
            2>&1 | tee test-output.log

      - name: Test results summary
        if: always()
        run: |
          {
            echo "## Full regression — shard ${{ matrix.shard }}/6 (suite=$SUITE profile=$PROFILE)"
            if [ -f "shard-results/shard-${{ matrix.shard }}.json" ] && command -v jq >/dev/null 2>&1; then
              jq -r '"- Files: \(.run_summary.file_count)  pass=\(.run_summary.pass) fail=\(.run_summary.fail) timeout=\(.run_summary.timeout) skip=\(.run_summary.skip)",
                     "- Wall clock: \(.run_summary.wall_clock_seconds)s  mode=\(.run_summary.execution_mode)  profile=\(.run_summary.profile)  shard=\(.run_summary.shard)",
                     "",
                     "### Slowest 10 files",
                     (.files | sort_by(-.duration_seconds)[:10][] | "- \(.duration_seconds)s \(.path)")' \
                "shard-results/shard-${{ matrix.shard }}.json" 2>/dev/null
            else
              echo "- (no JSON summary record — shard timed out or failed before reporting; see test-output.log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shard evidence
        if: always() # evidence retention: preserve partial progress even on timeout/failure
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}
          path: |
            shard-results/shard-${{ matrix.shard }}.json
            test-output.log
          if-no-files-found: warn
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Workflows suite: validates the GitHub workflow files themselves
  # (including this one). Independent of the main suite/profile.
  # ────────────────────────────────────────────────────────────
  workflows-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The W6 adversarial rehearsal check resolves a recorded head that
          # predates the checkout tip; default fetch-depth 1 cannot see it.
          fetch-depth: 0

      - uses: ./.github/actions/setup-racket
        with:
          racket-version: "8.10"

      - name: Clear stale bytecode
        run: find . -name compiled -type d -exec rm -rf {} + 2>/dev/null

      - name: Compile gate
        run: raco make main.rkt

      - name: Run workflows suite
        run: |
          set -euo pipefail
          mkdir -p shard-results
          STRICT_TEST_RUNNER=1 ./qt --lane workflows --jobs 4 \
            --json-out shard-results/workflows.json \
            2>&1 | tee test-output.log

      - name: Upload workflows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-workflows
          path: |
            shard-results/workflows.json
            test-output.log
          if-no-files-found: warn
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Platform variant: the curated platform-cross suite on macOS
  # (arm64) — the complementary platform to the linux shards above.
  # ────────────────────────────────────────────────────────────
  test-platform:
    # macOS 14 jobs began cancelling before any step ran on 2026-11-07;
    # use GitHub's currently supported floating macOS label so the platform
    # lane is actually schedulable. Failure evidence still fails closed.
    runs-on: macos-latest
    timeout-minutes: 90 # Retained through cache rollout: a cold locked store
                        # must complete before the warm-run evidence permits a
                        # measured budget reduction. The suite itself is ~15 min.
    steps:
      - uses: actions/checkout@v7

      # The reusable setup action is the sole cache owner. It restores the
      # locked, explicit PLTADDONDIR store and never caches workspace bytecode.
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: "8.10"

      - name: Clear stale bytecode
        run: find . -name compiled -type d -exec rm -rf {} + 2>/dev/null

      - name: Compile gate
        run: raco make main.rkt

      - name: Run platform-cross suite (macos-arm64)
        run: |
          set -euo pipefail
          mkdir -p shard-results
          STRICT_TEST_RUNNER=1 ./qt --lane platform --jobs 4 \
            --json-out shard-results/platform.json \
            2>&1 | tee test-output.log

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-platform
          path: |
            shard-results/platform.json
            test-output.log
          if-no-files-found: warn
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Racket 8.11 cross-version compatibility (W1, #9949).
  # The former ci.yml `test-cross-version` job re-ran the whole 1329-file
  # fast suite on Racket 8.11 on EVERY main push (~61 min — the largest
  # single main-CI job, docs/reports/TEST-WORK-MASS-v1.00.32.md). The
  # compatibility verification itself is retained here: same version
  # identity (8.11), a real fast-lane invocation, retained log/JSON
  # evidence — on the weekly schedule above and on every manual dispatch.
  # It is deliberately NOT a `summarize` required lane: the definitive
  # full-regression status (run-summary.json) remains exactly the six
  # Linux shards + workflows + platform lanes, so this job cannot weaken
  # or substitute for that evidence. The version-indexed package lock
  # (ci/racket-package-lock.rktd, schema-revision 2) accepts 8.11 —
  # pinned by tests/ci/verify-lock-selection-test.rkt.
  # ────────────────────────────────────────────────────────────
  cross-version-compat:
    if: >-
      ${{ (github.event_name == 'schedule' && github.event.schedule == '40 2 * * 6') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90 # unsharded fast suite under 8.11 measured ~61 min wall at --jobs 4
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-racket
        with:
          racket-version: "8.11"

      - name: Clear stale bytecode
        run: find . -name compiled -type d -exec rm -rf {} + 2>/dev/null

      - name: Compile gate
        run: raco make main.rkt

      - name: Run fast suite (Racket 8.11 compatibility)
        run: |
          set -euo pipefail
          mkdir -p shard-results
          # Explicit full-command lane surface (never bare `./qt --suite ...`:
          # the default PR lane refuses CI-surface flags). The lane names the
          # suite selection, so no --suite here.
          STRICT_TEST_RUNNER=1 ./qt full --lane fast --jobs 4 \
            --json-out shard-results/cross-version-811.json \
            2>&1 | tee test-output.log

      - name: Upload cross-version compatibility evidence
        if: always() # evidence retention: a red compat lane must keep its log + JSON
        uses: actions/upload-artifact@v7
        with:
          name: results-cross-version-811
          path: |
            shard-results/cross-version-811.json
            test-output.log
          if-no-files-found: warn
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Aggregate: merge per-shard JSON (W0 schema) into the definitive
  # run summary. Always runs so a timed-out shard surfaces as
  # status "timeout" — it can never vanish into a green run.
  # ────────────────────────────────────────────────────────────
  summarize:
    needs: [test, workflows-suite, test-platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-racket
        with:
          racket-version: "8.10"

      # Keep lane artifacts separate. A failed download remains observable to
      # the status helper as missing evidence, which becomes timeout rather
      # than preventing run-summary.json from being retained.
      - name: Download Linux shard evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: evidence/linux-shards
          pattern: results-shard-*
          merge-multiple: true

      - name: Download workflows evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: results-workflows
          path: evidence/workflows

      - name: Download macOS platform evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: results-platform
          path: evidence/platform

      - name: Aggregate all required lane evidence
        id: status
        run: |
          set -euo pipefail
          mkdir -p evidence/linux-shards evidence/workflows evidence/platform
          racket scripts/run-tests/full-regression-status.rkt \
            --shards-dir evidence/linux-shards \
            --workflows-dir evidence/workflows \
            --platform-dir evidence/platform \
            --expected-shards 6 \
            --test-result "${{ needs.test.result }}" \
            --workflows-result "${{ needs.workflows-suite.result }}" \
            --platform-result "${{ needs.test-platform.result }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out run-summary.json \
            --matrix-out matrix-summary.json

          STATUS=$(jq -r '.status' run-summary.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "## Full regression — definitive status: **$STATUS**"
            echo ""
            echo "| required lane | job result | evidence | records | status |"
            echo "|---|---|---|---:|---|"
            jq -r '.required_lanes | to_entries[] | "| \(.value.name) | \(.value.upstream_job_result) | \(.value.evidence_classification) | \(.value.collected_records)/\(.value.expected_records) | \(.value.status) |"' run-summary.json
            echo ""
            jq -r '"- Linux totals: files=\(.totals.files) pass=\(.totals.pass) fail=\(.totals.fail) timeout=\(.totals.timeout) skip=\(.totals.skip)",
                   "- Wall clock (sum of Linux shards): \(.totals.wall_clock_seconds)s  suite=\(.suite)  profile=\(.profile)  runner-mode=\(.runner_mode)"' run-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Full-regression status: $STATUS"
          if [ "$STATUS" != "pass" ]; then
            exit 1
          fi

      - name: Upload run summary (release-readiness evidence)
        if: always() # retained even when red — this is the triage/release evidence
        uses: actions/upload-artifact@v7
        with:
          name: run-summary
          path: |
            run-summary.json
            matrix-summary.json
          if-no-files-found: error
          retention-days: 90

  report:
    needs: [summarize]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Definitive run status
        run: |
          echo "Full regression finished with definitive status: ${{ needs.summarize.outputs.status || 'unknown' }}"
          echo "Evidence artifacts: run-summary (90d), per-shard JSON + logs (30d)."
          echo "Triage protocol: docs/operations/test-regression-triage.md"
