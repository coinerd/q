name: 'Setup Racket'
description: 'Install Racket with a deterministic user package store and package-visible compilation gate'
inputs:
  racket-version:
    description: 'Racket version to install'
    required: false
    default: '8.10'
  prepared-environment:
    description: >-
      'auto' lets this action restore a verified prepared environment
      (producer artifact consumed via a needs producer in the calling
      workflow) and skip the redundant Racket install and raco setup
      compile below; 'off' (default) keeps the full per-job path.
      Additional guards inside: Linux runners only and a non-empty
      prepared-installer-sha256. The repository-level rollback switch
      RACKET_PREPARED_ARTIFACT=off is evaluated by opting call sites
      (it keeps this input at 'off').
    required: false
    default: 'off'
  prepared-artifact-name:
    description: 'Prepared-environment artifact name to restore when prepared-environment=auto'
    required: false
    default: 'prepared-env-fast'
  prepared-installer-sha256:
    description: >-
      Published SHA-256 of the official installer archive; required by
      the restore path when prepared-environment=auto (empty disables
      the prepared path and falls through to the full path).
    required: false
    default: ''
outputs:
  prepared-env-result:
    description: >-
      Outcome of the guarded prepared-environment restore: 'success'
      (manifest-verified restore; install+compile skipped),
      'failure' (restore mismatched or failed; this action fell back to
      the full path and flagged the fallback), or 'skipped' (prepared
      path not requested for this call site).
    value: ${{ steps.prepared-env.outcome }}
  prepared-env-state:
    description: >-
      Normalized prepared-environment state for the W1 telemetry
      contract: 'restored' (manifest-verified restore), 'rebuilt'
      (restore failed or not requested and the full path ran), or
      'unavailable' (prepared path not in play; matches the runner's
      local-run default).
    value: >-
      ${{ steps.prepared-env.outcome == 'success' && 'restored' ||
          steps.prepared-env.outcome == 'failure' && 'rebuilt' ||
          'unavailable' }}
  prepared-env-restore-ms:
    description: >-
      Wall-clock milliseconds spent downloading and materializing the
      prepared environment when the guarded restore ran (success or
      failure); empty otherwise.
    value: ${{ steps.prepared-env.outputs.restore-ms }}
  prepared-env-fallback-ms:
    description: >-
      Wall-clock milliseconds spent on the full install+compile fallback
      path when the guarded restore did not succeed; empty when the
      prepared path skipped the full path (restore succeeded).
    value: ${{ steps.setup-compile.outputs.setup-duration-s != '' && (steps.setup-compile.outputs.setup-duration-s * 1000) || '' }}
runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------
    # W3 prepared-environment restore (guarded; ubuntu fast-gate lanes
    # only, docs/reports/CI-RACKET-CACHE-POLICY.md lane split). A
    # manifest-verified restore replaces the install+compile steps below
    # for this job; anything else — mismatch, missing artifact, or a call
    # site that did not opt in — runs the FULL path below, and a fallback
    # after a failed restore is flagged, never a silent rebuild. macOS
    # lanes cannot opt in: the runner.os guard plus the per-call-site
    # default 'off' keep the v1.00.10 compile-on-every-hit condition.
    # ------------------------------------------------------------------
    - name: Restore verified prepared environment (guarded)
      id: prepared-env
      if: ${{ inputs.prepared-environment == 'auto' && runner.os == 'Linux' && inputs.prepared-installer-sha256 != '' }}
      continue-on-error: true
      uses: ./.github/actions/restore-racket-environment
      with:
        racket-version: ${{ inputs.racket-version }}
        installer-sha256: ${{ inputs.prepared-installer-sha256 }}
        artifact-name: ${{ inputs.prepared-artifact-name }}

    - name: Prepared-environment fallback marker (rebuilt, never silent)
      if: steps.prepared-env.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        echo "::warning::prepared-environment restore failed or mismatched; this job falls back to the full setup path and the artifact is marked as rebuilt (the next producer run re-uploads it)"
        {
          echo "## Racket package setup — prepared environment REBUILT (fallback)"
          echo "- Restore outcome: failure — this job ran the full install+compile path; the producer rebuilds the artifact on its next run. Fallback is flagged, never silent (docs/reports/CI-RACKET-CACHE-POLICY.md)."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Prepared-environment restored (verified) — install and compile skipped
      if: steps.prepared-env.outcome == 'success'
      shell: bash
      env:
        RESTORE_MS: ${{ steps.prepared-env.outputs.restore-ms }}
        LOCK_DIGEST: ${{ steps.prepared-env.outputs.lock-digest }}
      run: |
        set -euo pipefail
        {
          echo "## Racket package setup — prepared environment restored"
          echo "- Restore outcome: success (manifest verified against this job's tuple; lock digest \`${LOCK_DIGEST}\`)"
          echo "- Restore wall clock: ${RESTORE_MS:-n/a} ms"
          echo "- Racket install + package-visible compile skipped per the ubuntu fast-gate lane split (docs/reports/CI-RACKET-CACHE-POLICY.md); the restore's four read-only health checks replace them."
        } >> "$GITHUB_STEP_SUMMARY"

    # The steps below are the FULL path. They are skipped only when the
    # guarded restore above succeeded for this job; every other run —
    # including every exact addon-cache hit — still compiles.
    - name: Clean stale q workspace bytecode
      if: steps.prepared-env.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail
        # The frozen discovery fixture (tests/metadata-discovery/fixture/)
        # keeps a TRACKED stray .rkt inside a compiled/ directory as pinned
        # input for tests/ci/metadata-discovery-test.rkt — never wipe it.
        find . -type f -name '*.zo' -not -path './tests/metadata-discovery/fixture/*' -delete
        find . -depth -type d -name compiled -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} +

    # Racket’s default macOS user store is ~/Library/Racket/<version>, while
    # Linux uses a different default. Make the cacheable store explicit so the
    # same composite action owns it on every runner, without caching source
    # bytecode from the fresh checkout.
    - name: Configure Racket user package store
      id: racket-store
      if: steps.prepared-env.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail
        addon_base="$HOME/.cache/q-racket-addon"
        addon_path="$addon_base/${{ inputs.racket-version }}"
        echo "PLTADDONDIR=$addon_base" >> "$GITHUB_ENV"
        echo "addon_path=$addon_path" >> "$GITHUB_OUTPUT"

    # Exact only: a dependency-lock mismatch must create a clean store, never
    # restore a potentially incompatible package graph through a prefix key.
    - name: Restore locked Racket user package store
      id: racket-addon-cache
      if: steps.prepared-env.outcome != 'success'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.racket-store.outputs.addon_path }}
        key: >-
          racket-addon-v2-${{ runner.os }}-x64-cs-full-${{ inputs.racket-version }}-
          ${{ hashFiles('info.rkt', 'ci/racket-package-lock.rktd') }}

    - name: Install Racket
      if: steps.prepared-env.outcome != 'success'
      uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
      with:
        architecture: 'x64'
        distribution: 'full'
        variant: 'CS'
        version: ${{ inputs.racket-version }}

    # NOTE: No Xvfb / DISPLAY setup here. Starting a background Xvfb on
    # GitHub-hosted runners breaks jobs (the step hangs and TUI tests stall
    # when the background server is reaped between steps). TUI tests use the
    # native Racket terminal implementation and do not need an X display.

    # ------------------------------------------------------------------
    # Package setup: the package-visible compile boundary is mandatory. We separate link/
    # dependency acquisition from `raco setup`: an exact cache hit relinks q
    # to this checkout, verifies the reviewed dependency graph, then compiles
    # every q collection without rebuilding documentation.
    # ------------------------------------------------------------------
    - name: Link q and compile package-visible modules
      id: setup-compile
      if: steps.prepared-env.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail
        setup_started=$(date +%s)

        echo "=== Package Setup Diagnostics ==="
        echo "Racket version: $(racket --version)"
        echo "Working directory: $PWD"
        echo "PLTADDONDIR: ${PLTADDONDIR:?PLTADDONDIR must be configured}"
        echo "Racket package cache hit: ${{ steps.racket-addon-cache.outputs.cache-hit }}"
        echo "::group::Racket toolchain diagnostics"
        raco help >/dev/null
        echo "::endgroup::"
        echo "Package state:"
        raco pkg show --scope user q || true
        echo ""

        # raco pkg show exits 0 even when the package is absent (it prints
        # "[none]"), so exit status cannot detect installation. Compare the
        # trimmed output instead.
        q_installed() {
          [ "$(raco pkg show --scope user q 2>/dev/null | tr -d '[:space:]')" != "[none]" ]
        }

        if [ "${{ steps.racket-addon-cache.outputs.cache-hit }}" = "true" ]; then
          if ! q_installed; then
            echo "::error::Exact Racket cache hit lacks the q user package; bump the cache schema or repair ci/racket-package-lock.rktd. Reproduce locally with: racket scripts/ci-package-setup.rkt --preflight"
            exit 1
          fi

          echo "::group::Verifying exact cached dependency lock"
          racket ci/verify-racket-package-lock.rkt
          echo "::endgroup::"

          echo "::group::Relinking q to the checked-out source without global setup"
          set +e
          raco pkg update --name q --link --batch --no-setup "$PWD"
          UPDATE_RC=$?
          set -e
          if [ "$UPDATE_RC" -ne 0 ]; then
            echo "::error::q relink failed (UPDATE_RC=$UPDATE_RC). Reproduce locally with: racket scripts/ci-package-setup.rkt --preflight"
            exit "$UPDATE_RC"
          fi
          echo "::endgroup::"
        else
          echo "::group::Installing reviewed q dependencies without global setup"
          # The pilot rollback runs after a producer that already link-
          # installed q into the shared user scope; relink instead of
          # failing on "package is already installed".
          if q_installed; then
            set +e
            raco pkg update --name q --link --batch --no-setup "$PWD"
            INSTALL_RC=$?
            set -e
          else
            set +e
            raco pkg install --name q --auto --batch --no-setup --no-docs "$PWD"
            INSTALL_RC=$?
            set -e
          fi
          if [ "$INSTALL_RC" -ne 0 ]; then
            echo "::error::q dependency installation failed (INSTALL_RC=$INSTALL_RC). Reproduce locally with: racket scripts/ci-package-setup.rkt --preflight"
            exit "$INSTALL_RC"
          fi
          echo "::endgroup::"

          echo "::group::Verifying freshly resolved dependency lock"
          racket ci/verify-racket-package-lock.rkt
          echo "::endgroup::"
        fi

        # Compile every q package-visible collection and the `fmt` command
        # package used by racket-tooling write validation. `fmt` is a build
        # dependency, so q setup alone does not reliably install its `raco`
        # command in a clean CI user store.
        #
        # Lane split (v1.00.16 W3, docs/reports/CI-RACKET-CACHE-POLICY.md):
        # this full install+compile path is the FALLBACK path for the
        # ubuntu fast-gate test shards (the guarded restore step at the
        # top of this action carries the prepared path). On a verified
        # prepared-environment restore this whole step is skipped; on
        # mismatch or producer failure the restore step above routes here
        # AND marks the artifact as rebuilt — never silently. The macOS
        # platform lane keeps compile-on-every-hit unconditionally per the
        # v1.00.10 release condition recorded in the policy doc.
        echo "::group::Compiling q collections and the formatter command"
        raco setup --no-docs --jobs 4 --pkgs q fmt
        raco fmt --help >/dev/null
        echo "::endgroup::"

        racket -e '(require quickcheck fmt) (displayln "Racket package store health check passed")'
        duration=$(( $(date +%s) - setup_started ))
        echo "setup-duration-s=$duration" >> "$GITHUB_OUTPUT"
        {
          echo "## Racket package setup"
          echo "- Cache hit: \`${{ steps.racket-addon-cache.outputs.cache-hit }}\`"
          echo "- User store: \`$PLTADDONDIR/${{ inputs.racket-version }}\`"
          echo "- Package-visible setup: ${duration}s"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "=== Package setup completed successfully ==="
