name: 'Setup Racket'
description: 'Install Racket with a deterministic user package store and package-visible compilation gate'
inputs:
  racket-version:
    description: 'Racket version to install'
    required: false
    default: '8.10'
  prepared-environment:
    description: >-
      'auto' lets this action restore a verified prepared environment
      (producer artifact consumed via a needs producer in the calling
      workflow) and skip the redundant Racket install and raco setup
      compile below; 'off' (default) keeps the full per-job path.
      Additional guards inside: Linux runners only and a non-empty
      prepared-installer-sha256. The repository-level rollback switch
      RACKET_PREPARED_ARTIFACT=off is evaluated by opting call sites
      (it keeps this input at 'off').
    required: false
    default: 'off'
  prepared-artifact-name:
    description: 'Prepared-environment artifact name to restore when prepared-environment=auto'
    required: false
    default: 'prepared-env-fast'
  prepared-installer-sha256:
    description: >-
      Published SHA-256 of the official installer archive; required by
      the restore path when prepared-environment=auto (empty disables
      the prepared path and falls through to the full path).
    required: false
    default: ''
outputs:
  prepared-env-result:
    description: >-
      Outcome of the guarded prepared-environment restore: 'success'
      (manifest-verified restore; install+compile skipped),
      'failure' (restore mismatched or failed; this action fell back to
      the full path and flagged the fallback), or 'skipped' (prepared
      path not requested for this call site).
    value: ${{ steps.prepared-env.outcome }}
  prepared-env-state:
    description: >-
      Normalized prepared-environment state for the W1 telemetry
      contract: 'restored' (manifest-verified restore), 'rebuilt'
      (restore failed or not requested and the full path ran), or
      'unavailable' (prepared path not in play; matches the runner's
      local-run default).
    value: >-
      ${{ steps.prepared-env.outcome == 'success' && 'restored' ||
          steps.prepared-env.outcome == 'failure' && 'rebuilt' ||
          'unavailable' }}
  prepared-env-restore-ms:
    description: >-
      Wall-clock milliseconds spent downloading and materializing the
      prepared environment when the guarded restore ran (success or
      failure); empty otherwise.
    value: ${{ steps.prepared-env.outputs.restore-ms }}
  prepared-env-fallback-ms:
    description: >-
      Wall-clock milliseconds spent on the full install+compile fallback
      path when the guarded restore did not succeed; empty when the
      prepared path skipped the full path (restore succeeded).
    value: ${{ steps.setup-duration.outputs.fallback-ms }}
  prepared-env-identity-result:
    description: >-
      W6 identity-manifest compare outcome for a verified restore:
      'verified' (all nine identity dimensions match the job's required
      tuple), 'mismatch' (this action routes the job to the loud, counted
      cold fallback), or empty (the prepared path was not in play).
    value: ${{ steps.prepared-env-identity.outputs.identity-result }}
  prepared-env-identity-fallback-count:
    description: >-
      W6 fallback counter: 1 when the identity compare mismatched (counted
      cold fallback taken), 0 on a verified identity, empty when the
      prepared path was not in play.
    value: ${{ steps.prepared-env-identity.outputs.identity-fallback-count }}
runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------
    # W3 prepared-environment restore (guarded; ubuntu fast-gate lanes
    # only, docs/reports/CI-RACKET-CACHE-POLICY.md lane split). A
    # manifest-verified restore replaces the install+compile steps below
    # for this job; anything else — mismatch, missing artifact, or a call
    # site that did not opt in — runs the FULL path below, and a fallback
    # after a failed restore is flagged, never a silent rebuild. macOS
    # lanes cannot opt in: the runner.os guard plus the per-call-site
    # default 'off' keep the v1.00.10 compile-on-every-hit condition.
    # ------------------------------------------------------------------
    - name: Restore verified prepared environment (guarded)
      id: prepared-env
      if: ${{ inputs.prepared-environment == 'auto' && runner.os == 'Linux' && inputs.prepared-installer-sha256 != '' }}
      continue-on-error: true
      uses: ./.github/actions/restore-racket-environment
      with:
        racket-version: ${{ inputs.racket-version }}
        installer-sha256: ${{ inputs.prepared-installer-sha256 }}
        artifact-name: ${{ inputs.prepared-artifact-name }}

    - name: Prepared-environment fallback marker (rebuilt, never silent)
      if: steps.prepared-env.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        echo "::warning::prepared-environment restore failed or mismatched; this job falls back to the full setup path and the artifact is marked as rebuilt (the next producer run re-uploads it)"
        {
          echo "## Racket package setup — prepared environment REBUILT (fallback)"
          echo "- Restore outcome: failure — this job ran the full install+compile path; the producer rebuilds the artifact on its next run. Fallback is flagged, never silent (docs/reports/CI-RACKET-CACHE-POLICY.md)."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Prepared-environment restored (verified) — install and compile skipped
      if: steps.prepared-env.outcome == 'success'
      shell: bash
      env:
        RESTORE_MS: ${{ steps.prepared-env.outputs.restore-ms }}
        LOCK_DIGEST: ${{ steps.prepared-env.outputs.lock-digest }}
      run: |
        set -euo pipefail
        {
          echo "## Racket package setup — prepared environment restored"
          echo "- Restore outcome: success (manifest verified against this job's tuple; lock digest \`${LOCK_DIGEST}\`)"
          echo "- Restore wall clock: ${RESTORE_MS:-n/a} ms"
          echo "- Racket install + package-visible compile skipped per the ubuntu fast-gate lane split (docs/reports/CI-RACKET-CACHE-POLICY.md); the restore's four read-only health checks replace them."
          echo "- Restored workspace bytecode is PURGED + verified before tests run (BUG-0065 systemic invariant, v1.00.29 W4): the fast suite lazily compiles from THIS checkout."
        } >> "$GITHUB_STEP_SUMMARY"

    # ------------------------------------------------------------------
    # W6 prepared-environment IDENTITY MANIFEST (spec §6 W4: the identity
    # is immutable and compared at restore; ANY mismatch = loud, counted
    # cold fallback — never silent acceptance). The guarded restore above
    # already hard-fails on repository/git-sha/os/arch/racket-version/
    # lock-digest; this step derives the W6 identity manifest of what this
    # job requires (expected: the call-site tuple + this checkout) and of
    # what the restored environment actually delivers (observed: this
    # runner's OS image, the job-local Racket executable digest, the
    # materialized store) and compares EVERY dimension through
    # scripts/ci/prepared-env-report.rkt --identity-compare. On a mismatch
    # the step emits ::warning, writes a counted fallback record and a
    # RUNNER_TEMP stamp, and routes the job to the FULL cold path below via
    # its identity-result output — the earlier "restored" note is
    # superseded by this step's summary section. A failure of the gate
    # itself is a hard failure — never a silent pass.
    # Honest scope note (v1.00.29 W6): the producer half (W3, frozen this
    # wave) records repository/git/os/arch/racket/lock/source in the
    # artifact manifest; the OS-image, executable-digest, resolved-set and
    # recipe dimensions are computed and recorded consumer-side and at
    # save time below, and the compare tooling fail-closes on them the
    # moment a producer manifest carries them. Distinct environments get
    # distinct artifact identities (derived from all nine dimensions), so
    # cross-Racket/platform/policy reuse is structurally excluded.
    # ------------------------------------------------------------------
    - name: Prepared-environment identity manifest (W6, compare at restore)
      id: prepared-env-identity
      if: steps.prepared-env.outcome == 'success'
      shell: bash
      env:
        RACKET_VERSION: ${{ inputs.racket-version }}
        ARTIFACT_NAME: ${{ inputs.prepared-artifact-name }}
        RECIPE_REVISION: 'setup-racket-prepared-restore-r1'
        POLICY_FINGERPRINT: 'addon-store-v2|pltaddon-explicit|no-workspace-bytecode'
      run: |
        set -euo pipefail
        report="scripts/ci/prepared-env-report.rkt"
        racket_exe="$(command -v racket)"
        exec_digest="$(sha256sum "$racket_exe" | cut -d' ' -f1)"
        lock_digest="$(racket ci/prepared-environment/manifest.rkt digest --file ci/racket-package-lock.rktd)"
        addon_dir="${PLTADDONDIR:-$HOME/.cache/q-racket-addon}/${RACKET_VERSION}"
        store_digest="$(find "$addon_dir" -type f -print0 2>/dev/null | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)"
        os_image="${ImageOS:-unknown}:${ImageVersion:-unknown}"
        expected="$RUNNER_TEMP/prepared-env-identity-expected.json"
        observed="$RUNNER_TEMP/prepared-env-identity-observed.json"
        verdict="$RUNNER_TEMP/prepared-env-identity-verdict.json"
        for side_file in "$expected" "$observed"; do
          racket "$report" --identity-emit --out "$side_file" \
            --os "${{ runner.os }}" \
            --os-image "$os_image" \
            --arch 'x64' \
            --racket-version "$RACKET_VERSION" \
            --racket-executable-digest "$exec_digest" \
            --lock-digest "$lock_digest" \
            --resolved-set-digest "$store_digest" \
            --precompile-recipe-revision "$RECIPE_REVISION" \
            --policy-fingerprint "$POLICY_FINGERPRINT" \
            --artifact-digest "$store_digest" \
            --artifact-name-base "$ARTIFACT_NAME"
        done
        rc=0
        racket "$report" --identity-compare --expected "$expected" --observed "$observed" \
          --consumer "${GITHUB_JOB:-unknown}" --out "$verdict" || rc=$?
        if [ "$rc" -eq 0 ]; then
          echo "identity-result=verified" >> "$GITHUB_OUTPUT"
          echo "identity-fallback-count=0" >> "$GITHUB_OUTPUT"
          identity_name="$(jq -r '.["expected-artifact-identity"]' "$verdict")"
          {
            echo "## Prepared-environment identity manifest verified (W6)"
            echo "- All nine identity dimensions match the job's required tuple; artifact identity: \`${identity_name}\`."
            echo "- Identity manifest + verdict stamped to RUNNER_TEMP (prepared-env-identity-{expected,observed,verdict}.json)."
          } >> "$GITHUB_STEP_SUMMARY"
        elif [ "$rc" -eq 1 ]; then
          # ANY mismatch = loud, counted cold fallback; never silent acceptance.
          echo "identity-result=mismatch" >> "$GITHUB_OUTPUT"
          echo "identity-fallback-count=1" >> "$GITHUB_OUTPUT"
        else
          # A failed identity GATE is a hard failure — never a silent pass.
          exit "$rc"
        fi

    - name: Prepared-environment identity fallback (W6, loud + counted cold path)
      id: prepared-env-identity-fallback
      if: steps.prepared-env-identity.outputs.identity-result == 'mismatch'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.prepared-artifact-name }}
        RECIPE_REVISION: 'setup-racket-prepared-restore-r1'
        POLICY_FINGERPRINT: 'addon-store-v2|pltaddon-explicit|no-workspace-bytecode'
      run: |
        set -euo pipefail
        report="scripts/ci/prepared-env-report.rkt"
        racket_exe="$(command -v racket)"
        exec_digest="$(sha256sum "$racket_exe" | cut -d' ' -f1)"
        lock_digest="$(racket ci/prepared-environment/manifest.rkt digest --file ci/racket-package-lock.rktd)"
        addon_dir="${PLTADDONDIR:-$HOME/.cache/q-racket-addon}/${{ inputs.racket-version }}"
        store_digest="$(find "$addon_dir" -type f -print0 2>/dev/null | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)"
        racket "$report" --identity-fallback-record \
          --out "$RUNNER_TEMP/prepared-env-identity-fallback-record.json" \
          --consumer "${GITHUB_JOB:-unknown}" \
          --reason "identity-mismatch-cold-fallback" \
          --identity-manifest "$RUNNER_TEMP/prepared-env-identity-observed.json" \
          --created-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        cp "$RUNNER_TEMP/prepared-env-identity-fallback-record.json" "$RUNNER_TEMP/prepared-env-identity-fallback-stamp.json"
        echo "::warning::prepared-environment identity mismatch on ${ARTIFACT_NAME}; this job takes the full cold setup path and the fallback is counted (stamp: prepared-env-identity-fallback-stamp.json)"
        {
          echo "## Prepared-environment IDENTITY MISMATCH — cold fallback (W6)"
          echo "- The identity manifest compare failed; the earlier 'restored' note is superseded: this job runs the FULL install+compile path."
          echo "- Fallback is loud and counted: ::warning above, RUNNER_TEMP stamp, and the counted fallback record."
          echo "- Environment recipe revision: \`$RECIPE_REVISION\`; policy: \`$POLICY_FINGERPRINT\`."
        } >> "$GITHUB_STEP_SUMMARY"

    # ------------------------------------------------------------------
    # BUG-0065 systemic invariant (v1.00.29 W4): EVERY path through this
    # action — full install+compile, flagged fallback, AND a successful
    # prepared-environment restore — purges workspace bytecode before any
    # test can execute. A restored prepared artifact materializes q
    # compiled/ output whose .zo mtimes are NEWER than this fresh
    # checkout (artifact extraction timestamps the restored files after
    # the checkout), so Racket would trust and execute producer-era
    # bytecode instead of the checked-out sources — the v1.00.27
    # cohort-report release-lane failure. Mtimes are NOT a freshness
    # signal, so the invariant is purge-based, not compare-based: this
    # workspace must hold no .zo that predates this job. After the purge
    # the step verifies that zero .zo remain outside the frozen
    # metadata-discovery fixture and FAILS CLOSED otherwise. The purge is
    # loud and counted (step summary + ::notice + RUNNER_TEMP stamp),
    # never silent; the stamp lands in RUNNER_TEMP because strict
    # tag-publish readiness requires a clean workspace.
    # Producer-side counterpart: the prepared artifact is stamped with
    # its manifest tuple (repository, git SHA, source digest, lock
    # digest) by prepare-racket-environment; consumers verify that tuple
    # on restore AND purge workspace bytecode unconditionally, so a stale
    # or unmatched artifact can never place executable producer bytecode.
    # Pinned repo-wide by tests/test-workflow-purge-contract.rkt and
    # docs/reports/PREPARED-ENV-BYTECODE-PINNING-v1.00.29.md.
    # ------------------------------------------------------------------
    - name: Purge and verify workspace bytecode (BUG-0065, every path)
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        # The frozen discovery fixture (tests/metadata-discovery/fixture/)
        # keeps a TRACKED stray .rkt inside a compiled/ directory as pinned
        # input for tests/ci/metadata-discovery-test.rkt — never wipe it.
        zo_before=$(find . -type f -name '*.zo' -not -path './tests/metadata-discovery/fixture/*' | wc -l | tr -d ' ')
        find . -type f -name '*.zo' -not -path './tests/metadata-discovery/fixture/*' -delete
        find . -depth -type d -name compiled -not -path './tests/metadata-discovery/fixture/*' -exec rm -rf {} +
        zo_after=$(find . -type f -name '*.zo' -not -path './tests/metadata-discovery/fixture/*' | wc -l | tr -d ' ')
        if [ "$zo_after" -ne 0 ]; then
          echo "::error::BUG-0065 workspace bytecode purge FAILED: ${zo_after} .zo file(s) remain outside the frozen fixture"
          find . -type f -name '*.zo' -not -path './tests/metadata-discovery/fixture/*' | head -20
          exit 1
        fi
        echo "::notice::BUG-0065 workspace bytecode purge: removed ${zo_before} stale .zo file(s); post-purge verification: 0 .zo outside the frozen fixture (prepared-env outcome: ${{ steps.prepared-env.outcome }})"
        printf '{"purged_zo": %s, "post_purge_zo": %s, "prepared_env_outcome": "%s"}\n' \
          "$zo_before" "$zo_after" '${{ steps.prepared-env.outcome }}' \
          > "$RUNNER_TEMP/bug-0065-purge-stamp.json"
        {
          echo "## Workspace bytecode purge (BUG-0065 systemic invariant)"
          echo "- Prepared-environment outcome for this job: \`${{ steps.prepared-env.outcome }}\`"
          echo "- Stale workspace .zo removed: **${zo_before}**; post-purge verification: 0 .zo outside the frozen metadata-discovery fixture"
          echo "- Restored prepared-artifact bytecode is never trusted by mtime; tests execute code compiled from THIS checkout (docs/reports/PREPARED-ENV-BYTECODE-PINNING-v1.00.29.md)"
        } >> "$GITHUB_STEP_SUMMARY"

    # The steps below are the FULL path (install + compile). They are
    # skipped only when the guarded restore above succeeded for this job;
    # every other run — including every exact addon-cache hit — still
    # compiles. The BUG-0065 purge above runs on EVERY path regardless.
    # Racket’s default macOS user store is ~/Library/Racket/<version>, while
    # Linux uses a different default. Make the cacheable store explicit so the
    # same composite action owns it on every runner, without caching source
    # bytecode from the fresh checkout.
    - name: Configure Racket user package store
      id: racket-store
      if: steps.prepared-env.outcome != 'success' || steps.prepared-env-identity.outputs.identity-result == 'mismatch'
      shell: bash
      run: |
        set -euo pipefail
        addon_base="$HOME/.cache/q-racket-addon"
        addon_path="$addon_base/${{ inputs.racket-version }}"
        echo "PLTADDONDIR=$addon_base" >> "$GITHUB_ENV"
        echo "addon_path=$addon_path" >> "$GITHUB_OUTPUT"

    # Exact only: a dependency-lock mismatch must create a clean store, never
    # restore a potentially incompatible package graph through a prefix key.
    - name: Restore locked Racket user package store
      id: racket-addon-cache
      if: steps.prepared-env.outcome != 'success' || steps.prepared-env-identity.outputs.identity-result == 'mismatch'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.racket-store.outputs.addon_path }}
        key: >-
          racket-addon-v2-${{ runner.os }}-x64-cs-full-${{ inputs.racket-version }}-
          ${{ hashFiles('info.rkt', 'ci/racket-package-lock.rktd') }}

    - name: Install Racket
      if: steps.prepared-env.outcome != 'success' || steps.prepared-env-identity.outputs.identity-result == 'mismatch'
      uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
      with:
        architecture: 'x64'
        distribution: 'full'
        variant: 'CS'
        version: ${{ inputs.racket-version }}

    # NOTE: No Xvfb / DISPLAY setup here. Starting a background Xvfb on
    # GitHub-hosted runners breaks jobs (the step hangs and TUI tests stall
    # when the background server is reaped between steps). TUI tests use the
    # native Racket terminal implementation and do not need an X display.

    # ------------------------------------------------------------------
    # Package setup: the package-visible compile boundary is mandatory. We separate link/
    # dependency acquisition from `raco setup`: an exact cache hit relinks q
    # to this checkout, verifies the reviewed dependency graph, then compiles
    # every q collection without rebuilding documentation.
    # ------------------------------------------------------------------
    - name: Link q and compile package-visible modules
      id: setup-compile
      if: steps.prepared-env.outcome != 'success' || steps.prepared-env-identity.outputs.identity-result == 'mismatch'
      shell: bash
      run: |
        set -euo pipefail
        setup_started=$(date +%s)

        echo "=== Package Setup Diagnostics ==="
        echo "Racket version: $(racket --version)"
        echo "Working directory: $PWD"
        echo "PLTADDONDIR: ${PLTADDONDIR:?PLTADDONDIR must be configured}"
        echo "Racket package cache hit: ${{ steps.racket-addon-cache.outputs.cache-hit }}"
        echo "::group::Racket toolchain diagnostics"
        raco help >/dev/null
        echo "::endgroup::"
        echo "Package state:"
        raco pkg show --scope user q || true
        echo ""

        # raco pkg show exits 0 even when the package is absent (it prints
        # "[none]"), so exit status cannot detect installation. Compare the
        # trimmed output instead.
        q_installed() {
          [ "$(raco pkg show --scope user q 2>/dev/null | tr -d '[:space:]')" != "[none]" ]
        }

        if [ "${{ steps.racket-addon-cache.outputs.cache-hit }}" = "true" ]; then
          if ! q_installed; then
            echo "::error::Exact Racket cache hit lacks the q user package; bump the cache schema or repair ci/racket-package-lock.rktd. Reproduce locally with: racket scripts/ci-package-setup.rkt --preflight"
            exit 1
          fi

          echo "::group::Verifying exact cached dependency lock"
          racket ci/verify-racket-package-lock.rkt
          echo "::endgroup::"

          echo "::group::Relinking q to the checked-out source without global setup"
          set +e
          raco pkg update --name q --link --batch --no-setup "$PWD"
          UPDATE_RC=$?
          set -e
          if [ "$UPDATE_RC" -ne 0 ]; then
            echo "::error::q relink failed (UPDATE_RC=$UPDATE_RC). Reproduce locally with: racket scripts/ci-package-setup.rkt --preflight"
            exit "$UPDATE_RC"
          fi
          echo "::endgroup::"
        else
          echo "::group::Installing reviewed q dependencies without global setup"
          # The pilot rollback runs after a producer that already link-
          # installed q into the shared user scope; relink instead of
          # failing on "package is already installed".
          if q_installed; then
            set +e
            raco pkg update --name q --link --batch --no-setup "$PWD"
            INSTALL_RC=$?
            set -e
          else
            set +e
            raco pkg install --name q --auto --batch --no-setup --no-docs "$PWD"
            INSTALL_RC=$?
            set -e
          fi
          if [ "$INSTALL_RC" -ne 0 ]; then
            echo "::error::q dependency installation failed (INSTALL_RC=$INSTALL_RC). Reproduce locally with: racket scripts/ci-package-setup.rkt --preflight"
            exit "$INSTALL_RC"
          fi
          echo "::endgroup::"

          echo "::group::Verifying freshly resolved dependency lock"
          racket ci/verify-racket-package-lock.rkt
          echo "::endgroup::"
        fi

        # Compile every q package-visible collection and the `fmt` command
        # package used by racket-tooling write validation. `fmt` is a build
        # dependency, so q setup alone does not reliably install its `raco`
        # command in a clean CI user store.
        #
        # Lane split (v1.00.16 W3, docs/reports/CI-RACKET-CACHE-POLICY.md):
        # this full install+compile path is the FALLBACK path for the
        # ubuntu fast-gate test shards (the guarded restore step at the
        # top of this action carries the prepared path). On a verified
        # prepared-environment restore this whole step is skipped; on
        # mismatch or producer failure the restore step above routes here
        # AND marks the artifact as rebuilt — never silently. The macOS
        # platform lane keeps compile-on-every-hit unconditionally per the
        # v1.00.10 release condition recorded in the policy doc.
        echo "::group::Compiling q collections and the formatter command"
        raco setup --no-docs --jobs 4 --pkgs q fmt
        raco fmt --help >/dev/null
        echo "::endgroup::"

        racket -e '(require quickcheck fmt) (displayln "Racket package store health check passed")'
        duration=$(( $(date +%s) - setup_started ))
        echo "setup-duration-s=$duration" >> "$GITHUB_OUTPUT"
        {
          echo "## Racket package setup"
          echo "- Cache hit: \`${{ steps.racket-addon-cache.outputs.cache-hit }}\`"
          echo "- User store: \`$PLTADDONDIR/${{ inputs.racket-version }}\`"
          echo "- Package-visible setup: ${duration}s"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "=== Package setup completed successfully ==="

    - name: Calculate prepared-environment fallback duration
      id: setup-duration
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        seconds="${{ steps.setup-compile.outputs.setup-duration-s }}"
        if [ -n "$seconds" ]; then
          echo "fallback-ms=$((seconds * 1000))" >> "$GITHUB_OUTPUT"
        else
          echo "fallback-ms=" >> "$GITHUB_OUTPUT"
        fi

    # ------------------------------------------------------------------
    # W6 identity manifest, SAVE side (spec §6 W4: identity computed at
    # save time). Whenever this action builds a complete environment via
    # the full install+compile path — a primary cold build, a flagged
    # fallback, OR a counted identity-mismatch cold fallback — the action
    # records the identity of what it built: OS image, architecture,
    # Racket version + executable digest, lock digest, the materialized
    # store's resolved-set digest, the precompile recipe revision and the
    # policy knobs, plus the artifact digest over the built store. The
    # manifest is stamped to RUNNER_TEMP, echoed to the step summary and
    # counted, so every environment this action produces has a durable,
    # comparable identity — and every cold fallback is observable.
    # ------------------------------------------------------------------
    - name: Prepared-environment identity manifest (W6, save side)
      id: prepared-env-identity-save
      if: steps.setup-compile.conclusion == 'success'
      shell: bash
      env:
        RACKET_VERSION: ${{ inputs.racket-version }}
        ARTIFACT_NAME: ${{ inputs.prepared-artifact-name }}
        RECIPE_REVISION: 'setup-racket-full-path-r1'
        POLICY_FINGERPRINT: 'addon-store-v2|pltaddon-explicit|no-workspace-bytecode'
      run: |
        set -euo pipefail
        report="scripts/ci/prepared-env-report.rkt"
        racket_exe="$(command -v racket)"
        exec_digest="$(sha256sum "$racket_exe" | cut -d' ' -f1)"
        lock_digest="$(racket ci/prepared-environment/manifest.rkt digest --file ci/racket-package-lock.rktd)"
        addon_dir="${PLTADDONDIR:-$HOME/.cache/q-racket-addon}/${RACKET_VERSION}"
        store_digest="$(find "$addon_dir" -type f -print0 2>/dev/null | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)"
        os_image="${ImageOS:-unknown}:${ImageVersion:-unknown}"
        saved="$RUNNER_TEMP/prepared-env-identity-saved.json"
        racket "$report" --identity-emit --out "$saved" \
          --os "${{ runner.os }}" \
          --os-image "$os_image" \
          --arch 'x64' \
          --racket-version "$RACKET_VERSION" \
          --racket-executable-digest "$exec_digest" \
          --lock-digest "$lock_digest" \
          --resolved-set-digest "$store_digest" \
          --precompile-recipe-revision "$RECIPE_REVISION" \
          --policy-fingerprint "$POLICY_FINGERPRINT" \
          --artifact-digest "$store_digest" \
          --artifact-name-base "$ARTIFACT_NAME"
        cp "$saved" "$RUNNER_TEMP/prepared-env-identity-save-stamp.json"
        identity_name="$(jq -r '.["artifact-identity"]' "$saved")"
        echo "::notice::prepared-environment identity manifest saved for this built environment (recipe $RECIPE_REVISION; artifact identity ${identity_name})"
        {
          echo "## Prepared-environment identity manifest — save side (W6)"
          echo "- Environment recipe revision: \`$RECIPE_REVISION\`; policy: \`$POLICY_FINGERPRINT\`."
          echo "- Artifact identity of this built environment: \`${identity_name}\` (manifest: prepared-env-identity-saved.json; stamp: prepared-env-identity-save-stamp.json)."
          echo "- OS image: \`$os_image\`; Racket executable digest: \`${exec_digest:0:12}…\`; resolved-set digest: \`${store_digest:0:12}…\`."
        } >> "$GITHUB_STEP_SUMMARY"
